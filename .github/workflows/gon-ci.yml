name: GON CI

on:
  pull_request:
    paths:
      - ".github/workflows/gon-ci.yml"
      - "apps/gon-adk/**"
      - "apps/gon-web/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/gon-ci.yml"
      - "apps/gon-adk/**"
      - "apps/gon-web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gon-web:
    name: GON Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/gon-web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_SECRET: "ci-build-only-not-a-production-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gon-web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Production unit tests
        run: npm test

      # R1.12: anti-regression coverage floor on the production suite
      # (thresholds in vitest.config.mts, measured baseline 24/10/2026).
      - name: Coverage gate
        run: npm run test:coverage

      - name: PostgreSQL migration and hybrid Search integration tests
        run: npm run test:postgres

      - name: Legacy prototype regression tests
        run: npm run test:legacy

      - name: Typecheck
        run: npm run typecheck

      - name: Static migration checks
        run: npm run db:check

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  gon-storybook:
    name: GON Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/gon-web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gon-web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build GON Storybook
        run: npm run storybook:build

  gon-adk:
    name: GON ADK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/gon-adk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/gon-adk/requirements.lock

      - name: Install ADK service and locked dependencies
        run: |
          python -m pip install --upgrade pip "setuptools==84.2.1"
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Contract service tests
        run: python -m pytest -q

      - name: Dependency consistency
        run: python -m pip check

      # R1.12: governed vulnerability exceptions replace the bare
      # `--ignore-vuln` (F-P05-10). The gate audits requirements.lock and
      # fails on unexplained findings, stale exceptions or expired ones.
      - name: Dependency audit (governed exceptions)
        run: python scripts/supply-chain/check-exceptions.py

      # B104 (binding 0.0.0.0) is tracked as F-P05-23 and is only acceptable
      # behind internal ingress. High-severity Bandit findings remain gating.
      - name: Python SAST
        run: python -m bandit -r src --severity-level high

  gon-contracts:
    name: GON Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned contract validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openapi-spec-validator==0.8.2"

      - name: Validate P03 contracts
        working-directory: apps/gon-web
        run: python docs/04-contracts/tests/validate_contracts.py
