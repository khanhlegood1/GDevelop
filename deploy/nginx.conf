server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    # One private shared workspace, not separate accounts or tenant isolation.
    auth_basic "GDevelop workspace";
    auth_basic_user_file /etc/nginx/workspace.htpasswd;

    location ^~ /api/storage/ {
        client_max_body_size 32m;
        proxy_pass http://storage:3001;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_read_timeout 120s;
        proxy_cache off;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Do not set X-Frame-Options here: embedding the editor may be intentional.
    # Do not set COEP/COOP without testing upstream cloud and asset integrations.
    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json application/wasm text/css;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Missing executable assets must return 404, never the SPA HTML shell.
    # No stale service worker or unversioned core/runtime after an upgrade.
    location = /service-worker.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location /GDJS/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location /browser_sw_preview/ {
        # These files are served by the browser service worker, not the server.
        return 404;
    }
    location ~* \.(?:js|wasm|json|css|png|jpe?g|gif|svg|ico|woff2?|ttf|mp3|ogg|wav|zip)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
