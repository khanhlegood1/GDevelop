<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="GON — Standalone Front-End Demo v2 (TikTok-style). Feed xu hướng, Brew, học đa định dạng, POAP. Dữ liệu mô phỏng, không backend.">
<title>GON — Xác nhận Front End (TikTok-style Demo)</title>
<style>
/* ============ GON tokens ============ */
:root{
  --midnight:#0e0f19; --midnight-2:#161827; --midnight-3:#1f2233;
  --emerald:#12b981; --gold:#ffc531; --crimson:#d22630; --crimson-soft:#fe2c55;
  --cyan:#28b9d8; --violet:#7c5cff;
  --ink:#182233; --muted:#8a93a8;
  --line:rgba(187,201,228,.14);
  --tabbar:62px;
  font-family:"Be Vietnam Pro",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{color:#f4f7ff;background:var(--midnight);
  font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:8px;left:8px;z-index:200;padding:10px 14px;border-radius:999px;background:var(--gold);color:var(--ink);transform:translateY(-300%);text-decoration:none;font-weight:700}
.skip-link:focus{transform:none}

/* ============ Banner ============ */
.demo-banner{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;gap:14px;align-items:center;
  padding:6px 14px;background:var(--gold);color:#3d2b00;font-size:.74rem;font-weight:600}
.demo-banner b{letter-spacing:.4px}
.demo-banner .mini{margin-left:auto;font-weight:400;opacity:.85}

/* ============ App shell ============ */
#app{position:fixed;inset:0;padding-top:30px;display:flex;flex-direction:row}
#main-col{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---- Sidebar trái (kiểu TikTok desktop) ---- */
#sidebar{width:236px;flex:0 0 auto;display:flex;flex-direction:column;gap:6px;padding:16px 12px 12px;
  border-right:1px solid var(--line);background:rgba(10,11,20,.55);overflow-y:auto;scrollbar-width:thin}
.sb-brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;padding:4px 10px 14px}
.sb-mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--emerald),var(--cyan));color:#06251b;font-weight:800;font-size:1.1rem}
.sb-brand small{display:block;color:var(--muted);font-size:.58rem;letter-spacing:1.6px}
.sb-nav{display:flex;flex-direction:column;gap:2px}
.sb-item{display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;border-radius:12px;
  color:#dfe7f7;font-weight:600;font-size:.9rem;text-align:left;min-height:46px}
.sb-item:hover{background:rgba(255,255,255,.06)}
.sb-item.active{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(40,185,216,.35)}
.sb-item .em{font-size:1.15rem;width:24px;text-align:center}
.sb-suggest{margin-top:14px;padding:0 4px}
.sb-label{margin:0 0 8px;color:var(--muted);font-size:.66rem;letter-spacing:1.6px;text-transform:uppercase}
.sb-hot-item{display:flex;gap:8px;align-items:center;width:100%;padding:7px 8px;border-radius:10px;text-align:left;color:#cfd9ec;font-size:.78rem}
.sb-hot-item:hover{background:rgba(255,255,255,.06)}
.sb-hot-item .bar{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;min-width:26px}
.sb-hot-item .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--crimson-soft),var(--gold))}
.sb-hot-item .n{font-weight:800;color:var(--gold);font-size:.7rem}
.sb-footer{margin-top:auto;padding:12px 8px 0;color:var(--muted);font-size:.62rem;line-height:1.5;border-top:1px solid var(--line)}

/* ---- Thanh tìm kiếm trên (kiểu TikTok) ---- */
#topsearch{display:none;align-items:center;gap:10px;padding:11px 20px;flex:0 0 auto;
  border-bottom:1px solid var(--line);background:rgba(10,11,20,.78);backdrop-filter:blur(12px)}
#topsearch.on{display:flex}
#topsearch-input{flex:1;padding:11px 46px 11px 42px;border:1px solid var(--line);border-radius:99px;
  background:rgba(255,255,255,.07);color:#f4f7ff}
#topsearch-input::placeholder{color:var(--muted)}
.ts-icon{position:relative;left:-9999px}
#topsearch .ts-icon{position:static;order:0;font-size:1rem;margin-right:-34px;z-index:2;pointer-events:none}
.ts-btn{padding:10px 20px;border-radius:99px;background:linear-gradient(135deg,var(--crimson-soft),var(--violet));
  color:#fff;font-weight:700;font-size:.86rem}
@media (max-width:899px){ #sidebar{display:none} }
@media (min-width:900px){ #tabbar{display:none !important} }
#view{flex:1;min-height:0;overflow:hidden;position:relative}
.page{height:100%;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px calc(var(--tabbar) + 26px)}
.page.nopad{padding:0}
.page-head{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.page-head h1{margin:0;font-size:1.3rem;letter-spacing:-.4px;flex:1}
.back-btn{width:40px;height:40px;border-radius:12px;background:var(--midnight-3);font-size:1.05rem;flex:0 0 auto}

/* ============ Tab bar (TikTok) ============ */
#tabbar{flex:0 0 auto;height:var(--tabbar);display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(10,11,20,.96);border-top:1px solid var(--line);backdrop-filter:blur(14px);padding-bottom:env(safe-area-inset-bottom)}
#tabbar.hide{display:none}
.tab{display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;color:var(--muted);font-size:.62rem;font-weight:600;min-height:100%}
.tab .em{font-size:1.25rem;line-height:1}
.tab.active{color:#fff}
.tab.center .em{width:46px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--crimson-soft),var(--violet));
  display:grid;place-items:center;font-size:1.2rem;box-shadow:0 4px 16px rgba(254,44,85,.35)}

/* ============ Login ============ */
.login-wrap{height:100%;display:grid;place-items:center;padding:20px;overflow-y:auto}
.login-card{width:min(420px,100%);text-align:center}
.login-logo{width:84px;height:84px;border-radius:26px;margin:0 auto 14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--emerald),var(--cyan));color:#06251b;font-weight:800;font-size:2.2rem;
  box-shadow:0 18px 50px rgba(18,185,129,.35)}
.login-card h1{margin:0 0 4px;font-size:1.9rem;letter-spacing:-1px}
.login-card .sub{color:var(--muted);font-size:.85rem;letter-spacing:2.4px;margin-bottom:26px}
.btn-anon{width:100%;padding:15px 16px;border-radius:14px;margin:0 0 8px;
  background:linear-gradient(135deg,#1a6640,#2d8a5e,#00b8cc);color:#fff;font-size:1rem;font-weight:800;
  display:flex;gap:10px;align-items:center;justify-content:center;box-shadow:0 4px 22px rgba(0,184,204,.3)}
.anon-note{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:20px;
  color:var(--muted);font-size:.74rem}
.anon-help{width:26px;height:26px;border-radius:50%;border:1px solid rgba(40,185,216,.5);background:rgba(40,185,216,.1);
  color:var(--cyan);font-weight:900;font-size:.85rem;display:grid;place-items:center}
.divider{display:flex;gap:12px;align-items:center;margin:18px 0;color:var(--muted);font-size:.72rem;letter-spacing:2px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.btn-google{width:100%;padding:13px 16px;border-radius:13px;background:#fff;color:#1f2937;font-weight:700;
  display:flex;gap:10px;align-items:center;justify-content:center}
.login-resume{margin-top:22px}
.uuid-chip{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:99px;
  background:rgba(40,185,216,.1);border:1px solid rgba(40,185,216,.35);color:#8fdcf0;font-size:.72rem;font-family:ui-monospace,monospace}

/* ============ Feed (TikTok) ============ */
#feedtabs{display:none;flex:0 0 auto;justify-content:center;align-items:center;gap:30px;padding:12px 20px 0;border-bottom:1px solid var(--line)}
#feedtabs.on{display:flex}
.ftab{position:relative;padding:6px 2px 10px;color:var(--muted);font-weight:700;font-size:.98rem;background:transparent}
.ftab.active{color:#fff}
.ftab.active::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:2px;width:46px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--emerald),var(--cyan))}
#feed-scroll{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed-scroll::-webkit-scrollbar{display:none}
.fcard{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;padding:0 18px 24px}
.fc-bg{position:absolute;inset:0;display:grid;place-items:center;font-size:7rem;filter:saturate(.85) opacity(.9)}
.fc-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,20,.25) 0%,transparent 30%,transparent 55%,rgba(10,11,20,.88) 100%)}
.fc-info{position:relative;max-width:78%}
.fc-author{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.86rem;margin-bottom:8px}
.fc-author .av{width:34px;height:34px;border-radius:50%;background:var(--violet);display:grid;place-items:center;font-size:.7rem;font-weight:800;border:2px solid #fff}
.fc-author .lv{color:var(--gold);font-size:.72rem;font-weight:800}
.fc-info h2{margin:0 0 6px;font-size:1.35rem;line-height:1.25;letter-spacing:-.4px}
.fc-info .desc{margin:0 0 8px;color:rgba(255,255,255,.82);font-size:.88rem}
.fc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fc-tags .tg{font-size:.76rem;font-weight:700;color:#8fdcf0}
.fc-trend{display:inline-flex;gap:8px;align-items:center;padding:5px 12px;border-radius:99px;margin-bottom:12px;
  background:rgba(255,197,49,.14);border:1px solid rgba(255,197,49,.4);color:#ffd977;font-size:.76rem;font-weight:800}
.fc-trend .up{color:#7fe9bd}
.fc-mine{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:99px;margin-left:8px;
  background:rgba(18,185,129,.16);border:1px solid rgba(18,185,129,.5);color:#9ff0cf;font-size:.7rem;font-weight:800}
.fc-cta{display:flex;gap:10px;flex-wrap:wrap}
.fc-rail{position:absolute;right:10px;bottom:96px;display:flex;flex-direction:column;gap:16px;align-items:center;z-index:5}
.rail-btn{display:flex;flex-direction:column;gap:2px;align-items:center;color:#fff;font-size:.68rem;font-weight:700}
.rail-btn .em{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:1.3rem}
.rail-btn.liked .em{background:var(--crimson-soft);animation:pop .3s}
.rail-btn.loved .em{background:rgba(124,92,255,.4);animation:pop .3s}
.rail-btn.locked{opacity:.5}
@keyframes pop{50%{transform:scale(1.25)}}
.rail-av{width:46px;height:46px;border-radius:50%;background:var(--violet);border:2px solid #fff;display:grid;place-items:center;font-size:.72rem;font-weight:800;margin-bottom:6px}
.rail-disc{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2b2b3b,#000);display:grid;place-items:center;
  animation:spin 4s linear infinite;border:6px solid #23232f;font-size:.95rem}
@keyframes spin{to{transform:rotate(360deg)}}
.feed-hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:rgba(255,255,255,.45);font-size:.7rem;z-index:5}

/* ============ Primitives ============ */
.card{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--midnight-2);margin-bottom:14px}
.kicker{display:inline-block;margin-bottom:8px;padding:3px 10px;border-radius:99px;background:rgba(40,185,216,.14);
  color:var(--cyan);font-size:.7rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;padding:11px 18px;border-radius:12px;
  background:var(--midnight-3);color:#fff;font-weight:600}
.btn.primary{background:linear-gradient(135deg,var(--emerald),#0d9668);color:#04241a}
.btn.gold{background:var(--gold);color:#3d2b00}
.btn.ghost{border:1px solid var(--line);background:transparent}
.btn.danger{background:var(--crimson)}
.btn.sm{padding:7px 12px;font-size:.8rem}
.btn.google{background:#fff;color:#1f2937}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border:1px solid var(--line);border-radius:99px;
  background:rgba(255,255,255,.05);font-size:.76rem;color:#cfd9ec}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.68rem;font-weight:700}
.tag.ok{background:rgba(18,185,129,.16);color:#7fe9bd}
.tag.warn{background:rgba(255,197,49,.16);color:#ffd977}
.tag.bad{background:rgba(210,38,48,.18);color:#ff9aa1}
.tag.info{background:rgba(40,185,216,.15);color:#8fdcf0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
label.field{display:block;margin-bottom:12px}
label.field>span{display:block;margin-bottom:6px;font-size:.82rem;color:#cfd9ec}
input[type=text],input[type=search],textarea,select{width:100%;padding:11px 14px;border:1px solid var(--line);
  border-radius:12px;background:rgba(10,16,31,.6);color:#f4f7ff}
textarea{min-height:100px;resize:vertical}
.warnbox,.okbox{display:none;margin-top:10px;padding:12px 14px;border-radius:12px;font-size:.84rem}
.warnbox.show,.okbox.show{display:block}
.warnbox{border:1px solid rgba(255,197,49,.4);background:rgba(255,197,49,.1);color:#ffd977}
.okbox{border:1px solid rgba(18,185,129,.4);background:rgba(18,185,129,.1);color:#9ff0cf}

/* ============ Discover ============ */
.search-hero{padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--midnight-2);margin-bottom:14px}
.search-row{display:flex;gap:10px}
.attach-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.attach-btn{padding:6px 12px;border:1px dashed var(--line);border-radius:99px;color:#cfd9ec;font-size:.76rem}
.attach-btn:hover{border-color:var(--cyan);color:#fff}
.attached{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.attached .chip{border-color:var(--cyan)}
.hot-list{display:flex;flex-direction:column;gap:9px}
.hot-item{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:13px;background:var(--midnight-2);cursor:pointer}
.hot-item .n{width:26px;font-weight:900;color:var(--muted)}
.hot-item:nth-child(-n+3) .n{color:var(--crimson-soft)}
.hot-item .t{flex:1}
.hot-item .t b{display:block;font-size:.9rem}
.hot-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:5px}
.hot-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--crimson-soft),var(--gold))}
.verdict{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1px solid var(--line)}
.verdict.found{background:rgba(18,185,129,.1);border-color:rgba(18,185,129,.4)}
.verdict.related{background:rgba(40,185,216,.1);border-color:rgba(40,185,216,.4)}
.verdict.missing{background:rgba(255,197,49,.08);border-color:rgba(255,197,49,.4)}
.verdict.clarify{background:rgba(124,92,255,.1);border-color:rgba(124,92,255,.4)}
.verdict.blocked{background:rgba(210,38,48,.12);border-color:rgba(210,38,48,.45)}
.out-item{display:flex;gap:12px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:rgba(16,27,51,.5);margin-bottom:9px}
.out-item .rank{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--midnight-3);font-weight:800;font-size:.8rem}
.out-item.top .rank{background:var(--gold);color:#3d2b00}
.out-item .fmt{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:1.1rem;background:rgba(124,92,255,.18)}
.out-item .meta{flex:1;min-width:0}
.out-item h4{margin:0;font-size:.9rem}
.out-item p{margin:2px 0 0;font-size:.72rem;color:var(--muted)}
.score-bar{display:flex;gap:2px;margin-top:5px}
.score-bar i{height:4px;flex:1;border-radius:2px;background:rgba(255,255,255,.12)}
.score-bar i.on{background:var(--emerald)}

/* ============ Brew ============ */
.pipeline{display:grid;gap:10px;margin:14px 0}
.pipe-step{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:13px;opacity:.4;transition:.3s}
.pipe-step.active{opacity:1;border-color:var(--cyan);background:rgba(40,185,216,.08)}
.pipe-step.done{opacity:1;border-color:rgba(18,185,129,.5)}
.pipe-step .st-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--midnight-3);font-size:1.05rem}
.pipe-step .spinner{width:16px;height:16px;margin-left:auto;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--cyan);animation:spin 1s linear infinite;display:none}
.pipe-step.active .spinner{display:block}
.brew-visual{height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.brew-visual i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--cyan),var(--emerald));transition:width .4s}

/* ============ Module / learn ============ */
.section-item{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:13px;margin-bottom:9px;background:rgba(16,27,51,.5)}
.section-item .idx{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--midnight-3)}
.section-item.done{border-color:rgba(18,185,129,.45)}
.fmt-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fmt-chip{padding:3px 10px;border-radius:99px;font-size:.66rem;font-weight:700;background:rgba(124,92,255,.15);color:#c9bcff}
.lesson-prose{max-width:70ch}
.lesson-prose p{color:#dbe4f5}
.callout{padding:13px 15px;border-left:3px solid var(--gold);background:rgba(255,197,49,.07);border-radius:0 12px 12px 0;margin:12px 0}
.char-count{font-size:.72rem;color:var(--muted);text-align:right;margin-top:4px}
.info-steps{display:flex;flex-direction:column;gap:9px}
.info-step{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;color:var(--ink);font-weight:600}
.info-step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(16,27,51,.85);color:var(--gold);font-weight:800}
.video-mock{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#0b1230,#1d1145);border:1px solid var(--line)}
.video-mock .play{position:absolute;inset:0;display:grid;place-items:center;font-size:2.6rem;color:#fff;background:rgba(0,0,0,.25)}
.video-mock .bar{position:absolute;left:10px;right:10px;bottom:10px;height:7px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.video-mock .bar i{display:block;height:100%;width:0;background:var(--crimson-soft)}
.video-mock.playing .bar i{animation:fillbar 12s linear forwards}
@keyframes fillbar{to{width:100%}}
.img-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
.img-card{aspect-ratio:4/3;border-radius:12px;display:grid;place-items:center;font-size:.76rem;color:#fff;text-align:center;padding:8px}

/* ============ Game ============ */
.q-card{padding:14px;border:1px solid var(--line);border-radius:13px;margin-bottom:11px;background:rgba(16,27,51,.5)}
.q-card h4{margin:0 0 9px;font-size:.92rem}
.opt{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;font-size:.84rem}
.opt input{accent-color:var(--violet)}
.opt.correct{border-color:var(--emerald);background:rgba(18,185,129,.12)}
.opt.wrong{border-color:var(--crimson);background:rgba(210,38,48,.12)}

/* ============ Journey ============ */
.level-hero{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.level-ring{--pct:0;width:132px;height:132px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--emerald) calc(var(--pct)*1%),rgba(255,255,255,.08) 0);position:relative}
.level-ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--midnight-2)}
.level-ring .inner{position:relative;text-align:center}
.level-ring .inner b{display:block;font-size:1.8rem}
.mastery-row{display:flex;gap:12px;align-items:center;margin-bottom:11px}
/* Leaderboard (kiểu arena.ai — PO 24/10 23:54) */
.lb-tabs{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lb-tab{padding:8px 16px;border:1px solid var(--line);border-radius:99px;color:#cfd9ec;font-weight:700;font-size:.86rem}
.lb-tab.active{background:linear-gradient(135deg,var(--gold),#ff9d00);color:#231a00;border-color:transparent}
.lb-row{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.lb-row.me{border-color:var(--gold);background:rgba(255,197,49,.08)}
.lb-rank{width:46px;text-align:center;font-weight:800;font-size:1.05rem;flex:0 0 auto}
.lb-meta{flex:1;min-width:0}
.lb-meta h4{margin:0;font-size:.95rem}
.lb-num{font-weight:800;color:var(--gold)}
.mastery-row .bar{flex:1;height:9px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.mastery-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.xp-table{width:100%;border-collapse:collapse;font-size:.82rem}
.xp-table th,.xp-table td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}
.xp-table th{color:var(--muted);font-weight:600}
.xp-table td.amt{color:#7fe9bd;font-weight:700;text-align:right}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{padding:12px 8px;text-align:center;border:1px solid var(--line);border-radius:13px;background:rgba(16,27,51,.5)}
.badge .em{font-size:1.7rem;display:block;filter:grayscale(1) opacity(.4)}
.badge.unlocked .em{filter:none}
.badge b{display:block;font-size:.76rem;margin-top:5px}
.badge span{font-size:.64rem;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0 0 0 20px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:6px 0 12px}
.timeline li::before{content:"";position:absolute;left:-26px;top:12px;width:11px;height:11px;border-radius:50%;background:var(--cyan);border:3px solid var(--midnight)}
.timeline .t-meta{font-size:.68rem;color:var(--muted)}
.cert{padding:20px;border:2px dashed var(--gold);border-radius:14px;text-align:center;background:rgba(255,197,49,.05)}
.cert .cert-title{font-size:1.1rem;font-weight:800;letter-spacing:2px;color:var(--gold)}

/* ============ Arena / fork ============ */
.arena-stage{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.arena-card{padding:15px;border:1px solid var(--line);border-radius:14px;background:rgba(16,27,51,.6);display:flex;flex-direction:column;gap:9px}
.arena-card.chosen{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.arena-vs{display:grid;place-items:center;font-size:1.4rem;font-weight:900;color:var(--gold)}
.reveal{display:none;margin-top:6px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.05);font-size:.76rem}
.reveal.show{display:block}
.split-bar{display:flex;height:24px;border-radius:99px;overflow:hidden;font-size:.72rem;font-weight:800;color:#06251b}
.split-bar .a{background:var(--emerald);display:grid;place-items:center}
.split-bar .b{background:var(--gold);display:grid;place-items:center;color:#3d2b00}
.journey-card{padding:14px;border:1px solid var(--line);border-radius:13px;background:rgba(16,27,51,.5)}
.journey-card h4{margin:0 0 5px}
.fork-note{display:flex;gap:8px;align-items:center;font-size:.72rem;color:var(--muted)}
.avatar-mini{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.62rem;font-weight:800;background:var(--violet);color:#fff}

/* ============ Profile ============ */
.pf-head{display:flex;gap:16px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--midnight-2);margin-bottom:14px}
.pf-av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--cyan));display:grid;place-items:center;font-weight:800;font-size:1.3rem}
.pf-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pf-stat{text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:rgba(16,27,51,.5)}
.pf-stat b{display:block;font-size:1.15rem}
.pf-stat span{font-size:.68rem;color:var(--muted)}
.checkline{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);margin-bottom:9px;cursor:pointer}
.checkline input{width:19px;height:19px;accent-color:var(--emerald);margin-top:2px}

/* ============ Map ============ */
.flow-item{display:flex;gap:12px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:rgba(16,27,51,.5)}
.flow-item .fn{width:42px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--midnight-3);font-weight:800;font-size:.76rem}
.flow-item.done{border-color:rgba(18,185,129,.4)}

/* ============ Toast + modal + sheet ============ */
#toasts{position:fixed;right:14px;bottom:calc(var(--tabbar) + 18px);z-index:150;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;gap:10px;align-items:center;padding:11px 15px;border-radius:12px;background:#0c1428f2;
  border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.4);font-size:.84rem;animation:pop2 .25s}
.toast.xp{border-color:var(--emerald)}
.toast.badge-toast{border-color:var(--gold)}
@keyframes pop2{from{transform:translateY(10px);opacity:0}}
#modal-overlay{position:fixed;inset:0;z-index:160;display:none;place-items:center;background:rgba(5,9,20,.72);padding:18px}
#modal-overlay.show{display:grid}
.modal{width:min(540px,100%);max-height:84vh;overflow:auto;padding:24px;border-radius:20px;
  background:var(--midnight-2);border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.5)}
.modal h3{margin:0 0 10px}
.sheet-overlay{position:fixed;inset:0;z-index:140;display:none;flex-direction:column;justify-content:flex-end;background:rgba(5,9,20,.6)}
.sheet-overlay.show{display:flex}
.sheet{max-height:72vh;overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  border-radius:22px 22px 0 0;background:var(--midnight-2);border-top:1px solid var(--line)}
.sheet-handle{width:44px;height:5px;border-radius:99px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.comment{display:flex;gap:10px;margin-bottom:14px}
.comment .av{width:34px;height:34px;border-radius:50%;background:var(--midnight-3);display:grid;place-items:center;font-size:.62rem;font-weight:800;flex:0 0 auto}
.comment b{font-size:.78rem}
.comment p{margin:2px 0 0;font-size:.84rem;color:#dbe4f5}

@media (max-width:640px){
  .fc-info{max-width:74%}
  .arena-stage{grid-template-columns:1fr}
  .arena-vs{padding:2px 0}
}

<script>
"use strict";
/* =====================================================================
   GON — Standalone FE Demo v2 (TikTok-style, theo yêu cầu PO 24/10/2026)
   - Bỏ cổng 18+ & 2 checkbox đồng ý; đăng nhập ẩn danh UUID (không tài
     khoản) hoặc Google (mock) — tham khảo ai-doctor-admin LoginPage.jsx.
   - Phong cách TikTok: feed dọc toàn màn hình, tab bar 5 mục, like/
     comment/share/fork; output sau Brew trở thành card topic trong feed
     và có điểm xu hướng tăng theo tương tác.
   - Vẫn 100% mock, không network call. Lưu trữ: INDEXEDDB (PO 24/10
     23:36 — "chuyển sang dùng IndexedDB cho toàn bộ dự án"), fallback
     localStorage nếu môi trường không có IndexedDB; tự migrate dữ liệu
     localStorage cũ. Trang Khám phá mang theo dữ liệu từ thanh tìm kiếm
     (đồng bộ tất cả dữ liệu).
   - FE-Confirm-12 (25/10): Journey Agent kiểu Agent Mode (arena.ai) — 1 lệnh
     cho trọn hành trình học; orchestrator gán ngẫu nhiên kín tên mỗi phiên;
     5 tín hiệu Agent Arena map sang GON (checkpoint/remix/brew/honesty);
     tab "Agent (Net Improvement)" thứ 3 trong Leaderboard.
   - FE-Confirm-13 (25/10): Arena có MÀN HÌNH RIÊNG — menu "⚔️ Arena" đứng
     TRƯỚC Leaderboard; nhúng iframe arena cùng origin (arena-embed.html?
     embed=1 — stand-in demo cho FastChat self-host / Gradio ?embed=true);
     vote trong khung về trang chính qua postMessage, bảng vote cập nhật live.
   ===================================================================== */

/* ---------------- Trạng thái ---------------- */
var STORAGE_KEY = "gon-standalone-fe-demo-v2";
var DEFAULT_STATE = {
  started: false,
  account: null,        // {name, email|null, initials, anon:bool, uuid}
  xpLedger: [],
  visited: [],
  inputs: [],
  searches: [],         // "query|verdict"
  checks: [],
  votes: [],
  forks: [],
  badges: [],
  gameBest: null,
  formatsViewed: [],
  sectionsDone: [],
  brewed: [],           // {topic, t, trend}
  likes: {},            // cardId -> 1
  comments: {},         // cardId -> [{who, text}]
  shares: 0,
  personalization: true,
  picks: [],            // {out,title,persona,depth,t} — persona bộc lộ qua lựa chọn output (PO 24/10)
  loves: {},            // cardId -> {topic,t} — 💜 "Đã hiểu thật" (chỉ mở sau checkpoint của card đó)
  arenaBattles: [],     // {pairId,choice,model,t} — 1 vote mỗi cặp đấu (arena.ai-style)
  learnedCards: {},     // cardId -> 1 (đã qua checkpoint — mở khoá 💜)
  remixes: [],          // {from,fromAuthor,topic,persona,depth,t} — output phái sinh có ghi công nguồn
  agentJourneys: []     // FE-Confirm-12: {topic,orch,recovered,confirmed,t} — phiên Journey Agent (Agent Mode kiểu arena.ai)
};
function mergeState(raw){
  var out = JSON.parse(JSON.stringify(DEFAULT_STATE)), k;
  if(raw && typeof raw === "object"){
    for(k in raw){ if(Object.prototype.hasOwnProperty.call(out,k)) out[k] = raw[k]; }
  }
  return out;
}
function loadStateLegacy(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? mergeState(JSON.parse(raw)) : JSON.parse(JSON.stringify(DEFAULT_STATE));
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}
/* ---- IndexedDB (PO 24/10 23:36): kho chính của toàn bộ demo; localStorage chỉ còn là fallback + nguồn migrate ---- */
var IDB_NAME = "gon-standalone-fe-demo-v2", IDB_STORE = "state", IDB_KEY = "main", IDB_DB = null, IDB_FAILED = false;
function idbAvailable(){ return !IDB_FAILED && !!(window.indexedDB); }
function idbOpen(cb){
  if(IDB_DB){ cb(IDB_DB); return; }
  try{
    var req = window.indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(){ try{ req.result.createObjectStore(IDB_STORE); }catch(e){} };
    req.onsuccess = function(){ IDB_DB = req.result; cb(IDB_DB); };
    req.onerror = function(){ IDB_FAILED = true; cb(null); };
    req.onblocked = function(){ IDB_FAILED = true; cb(null); };
  }catch(e){ IDB_FAILED = true; cb(null); }
}
function idbGet(cb){
  if(!idbAvailable()){ cb(null); return; }
  idbOpen(function(db){
    if(!db){ cb(null); return; }
    try{
      var rq = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(IDB_KEY);
      rq.onsuccess = function(){ cb(rq.result || null); };
      rq.onerror = function(){ cb(null); };
    }catch(e){ cb(null); }
  });
}
function idbClear(cb){
  if(!idbAvailable()){ cb && cb(); return; }
  idbOpen(function(db){
    if(!db){ cb && cb(); return; }
    try{
      var tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).delete(IDB_KEY);
      tx.oncomplete = function(){ cb && cb(); };
      tx.onerror = function(){ cb && cb(); };
    }catch(e){ cb && cb(); }
  });
}
var BOOTED = false; // chặn save() trước khi nạp xong IndexedDB — tránh ghi đè dữ liệu thật bằng state mặc định
function save(){
  if(!BOOTED) return;
  if(idbAvailable()){
    idbOpen(function(db){
      if(!db){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }catch(e){} return; }
      try{ db.transaction(IDB_STORE, "readwrite").objectStore(IDB_STORE).put(JSON.parse(JSON.stringify(S)), IDB_KEY); }catch(e){}
    });
  }else{ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }catch(e){} }
}
var S = loadStateLegacy(); // giá trị tức thời; bootApp nạp lại từ IndexedDB rồi render
function bootApp(){
  if(!idbAvailable()){ S = loadStateLegacy(); BOOTED = true; render(); return; }
  idbGet(function(stored){
    if(stored){ S = mergeState(stored); BOOTED = true; }
    else{
      var legacy = null;
      try{ legacy = localStorage.getItem(STORAGE_KEY); }catch(e){}
      S = legacy ? mergeState(JSON.parse(legacy)) : JSON.parse(JSON.stringify(DEFAULT_STATE));
      BOOTED = true;
      if(legacy) save(); // migrate dữ liệu localStorage cũ vào IndexedDB một lần
    }
    render();
  });
}

function lifetimeXp(){ return S.xpLedger.reduce(function(a,e){ return a + e.amount; },0); }
function level(){ return Math.floor(lifetimeXp()/100); }
function levelPct(){ return lifetimeXp()%100; }
function eraName(){
  var lv = level();
  if(lv>=35) return "FOREVER";
  if(lv>=20) return "Kiến tạo";
  if(lv>=10) return "Học viên";
  if(lv>=1)  return "Mầm mống";
  return "Khởi đầu";
}

/* ---------------- XP / badge / toast ---------------- */
function toast(msg, cls){
  var t = document.createElement("div");
  t.className = "toast " + (cls||"");
  t.innerHTML = msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(function(){ t.remove(); }, 4200);
}
function addXp(amount, reason){
  var before = level();
  S.xpLedger.push({t:Date.now(), amount:amount, reason:reason}); save();
  toast("+" + amount + " XP · " + reason, "xp");
  var after = level();
  if(after > before){
    openModal('<h3>🎉 Lên cấp!</h3><p>Bạn đạt <b>Lv.' + after + '</b> — ' + eraName() + '.</p>' +
      '<p class="small muted mono">level = floor(LifetimeXP / 100) = floor(' + lifetimeXp() + '/100) = ' + after + ' · uncapped · Forever ở Lv.35+</p>' +
      '<div class="row"><button class="btn primary" type="button" onclick="closeModal()">Tuyệt</button></div>');
  }
}
var BADGES = {
  first_brew:  {em:"🧪", name:"Brew Đầu Tiên", desc:"Tạo topic mới bằng Brew"},
  first_proof: {em:"🛡️", name:"Bằng Chứng Đầu Tiên", desc:"Vượt checkpoint hiểu thật"},
  fork:        {em:"🍴", name:"Người Fork", desc:"Fork một hành trình"},
  arena:       {em:"⚔️", name:"Cư Dân Arena", desc:"Bình chọn đầu tiên"},
  formats:     {em:"🎨", name:"Đa Định Dạng", desc:"Xem ≥3 định dạng"},
  gamer:       {em:"🎮", name:"Nhiệm Vụ Nhỏ", desc:"Hoàn thành easy-task"},
  trending:    {em:"🔥", name:"Lên Xu Hướng", desc:"Output của bạn đạt 40 điểm xu hướng"},
  social:      {em:"💬", name:"Cộng Đồng", desc:"Thả tim hoặc bình luận"}
};
function grantBadge(id){
  if(S.badges.indexOf(id)!==-1) return;
  S.badges.push(id); save();
  toast("🏅 Huy hiệu: <b>" + BADGES[id].name + "</b>", "badge-toast");
}
function markVisited(id){ if(S.visited.indexOf(id)===-1){ S.visited.push(id); save(); } }
function trackInput(type, value){ S.inputs.push({type:type, value:value, t:Date.now()}); save(); }

/* ---------------- Modal / sheet ---------------- */
function openModal(html){ document.getElementById("modal-body").innerHTML = html; document.getElementById("modal-overlay").classList.add("show"); }
function closeModal(){ document.getElementById("modal-overlay").classList.remove("show"); }
document.getElementById("modal-overlay").addEventListener("click", function(e){ if(e.target===this) closeModal(); });
function openSheet(html){ document.getElementById("sheet-body").innerHTML = html; document.getElementById("sheet-overlay").classList.add("show"); }
function closeSheet(){ document.getElementById("sheet-overlay").classList.remove("show"); }
document.getElementById("sheet-overlay").addEventListener("click", function(e){ if(e.target===this) closeSheet(); });

function feedCards(){
  var cards = FEED_SEED.map(function(c){
    var mine = false, boost = S.likes[c.id] ? 2 : 0;
    return {id:c.id, em:c.em, topic:c.topic, desc:c.desc, author:c.author, authorLv:c.authorLv,
      tags:c.tags, base:c.base, boost:boost, fmt:c.fmt, sound:c.sound, target:c.target, mine:mine};
  });
  S.brewed.forEach(function(b, i){
    cards.push({id:"b"+i, em:"✨", topic:b.topic, desc:"Output bạn vừa Brew — tương tác để tăng nhiệt độ xu hướng.",
      author:S.account ? S.account.name : "Bạn", authorLv:level(), tags:["#brew","#gon"],
      base:b.trend, boost:0, fmt:"web", sound:"nhạc nền: Fresh Brew", target:"module", mine:true});
  });
  var REMIX_FMT = {phd:"web", kol:"video", fun:"game", adv:"infographic"};
  S.remixes.forEach(function(r, i){
    cards.push({id:"r"+i, em:"🎨", topic:r.topic, desc:"Remix từ " + r.fromAuthor + " · " + PERSONAS[r.persona].em + " " + PERSONAS[r.persona].label + " · " + DEPTHS[r.depth].label + " — tương tác để tăng nhiệt độ.",
      author:S.account ? S.account.name : "Bạn", authorLv:level(), tags:["#remix","#gon"],
      base:12, boost:0, fmt:REMIX_FMT[r.persona] || "web", sound:"nhạc nền: Remix Culture", target:"module", mine:true, remixOf:r.fromAuthor});
  });
  return cards;
}
function trendOf(c){ return c.base + c.boost + (S.comments[c.id] ? S.comments[c.id].length*5 : 0) + (S.likes[c.id]?3:0); }
function boostCard(id, n, why){
  FEED_SEED.forEach(function(c){ if(c.id===id) c.base = Math.min(100, c.base + n); });
  S.brewed.forEach(function(b, i){ if("b"+i===id) b.trend = Math.min(100, b.trend + n); });
  save();
  if(id.indexOf("b")===0){
    var b = S.brewed[Number(id.slice(1))];
    if(b && b.trend >= 40) grantBadge("trending");
    if(b && b.trend + n >= 30 && b.trend < 30) toast("🔥 Output \"" + b.topic + "\" đang lên xu hướng!");
  }
  if(why) toast("📈 +" + n + " xu hướng · " + why);
}

/* ---------------- Router ---------------- */
var ROUTES = {}, AFTER = {}, CURRENT = "";
var TAB_ROUTES = {feed:1, discover:1, journey:1, profile:1};
function nav(route){
  var h = "#/" + route;
  if(location.hash === h) render();
  else location.hash = h;
}
window.addEventListener("hashchange", render);

function render(){
  var route = (location.hash || "#/login").replace(/^#\//,"") || "login";
  if(!ROUTES[route]) route = "login";
  if(!S.started && route !== "login") route = "login"; // chưa đăng nhập: mọi route đều về login
  if(route === "brew"){ // PO 24/10 (muộn): Brew GỘP vào Khám phá (Arena có màn hình riêng từ FE-Confirm-13, PO 25/10)
    route = "discover";
    if(location.hash !== "#/discover"){ location.hash = "#/discover"; }
  }
  CURRENT = route;
  markVisited(route);
  document.getElementById("view").innerHTML = ROUTES[route]();
  if(AFTER[route]) AFTER[route]();
  var tb = document.getElementById("tabbar");
  if(TAB_ROUTES[route]){ tb.classList.remove("hide"); tb.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("active", t.getAttribute("data-nav")===route); }); }
  else tb.classList.add("hide");
  // Sidebar trái: hiện sau khi đăng nhập, highlight mục hiện tại
  var sb = document.getElementById("sidebar");
  sb.style.display = (route === "login") ? "none" : "";
  document.querySelectorAll(".sb-item").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-nav")===route); });
  renderSbHot();
  // Tab Bảng tin (Đang Hot / Dành cho bạn): trên cùng, trên cả thanh tìm kiếm — kiểu TikTok
  var ftbs = document.getElementById("feedtabs");
  ftbs.classList.toggle("on", route === "feed");
  ftbs.querySelectorAll(".ftab").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-t") === FEED_TAB); });
  // Thanh tìm kiếm trên: các tab chính, trừ Brew và Khám phá (trang Khám phá có ô tìm riêng)
  document.getElementById("topsearch").classList.toggle("on", !!(TAB_ROUTES[route] && route !== "brew" && route !== "discover"));
  // PO 24/10 23:36: đồng bộ tất cả dữ liệu tìm kiếm — thanh tìm trên mang theo query cuối
  var tsIn = document.getElementById("topsearch-input");
  if(tsIn && document.activeElement !== tsIn){ tsIn.value = LAST_QUERY || ""; }
  document.getElementById("banner-state").textContent = S.started ? (S.account && S.account.anon ? "Ẩn danh · " + S.account.uuid.slice(0,8) : "Demo") : "Chưa đăng nhập";
  window.scrollTo(0,0);
}

function cardColor(id){
  var palette = ["#1d2b53,#0e0f19","#3b1d53,#0e0f19","#1d5348,#0e0f19","#53301d,#0e0f19","#1d3a53,#0e0f19","#531d3a,#0e0f19"];
  var n = 0; for(var i=0;i<id.length;i++) n += id.charCodeAt(i);
  return palette[n % palette.length];
}
function initialsOf(name){ return name.split(" ").map(function(w){return w[0];}).join("").slice(0,2).toUpperCase(); }
function likeCount(id){ return 120 + (S.likes[id]?1:0) + ((id.charCodeAt(1)||3) % 900); }
function loveCount(id){ return 18 + (S.loves[id]?1:0) + ((id.charCodeAt(1)||3) % 40); }
function mockComments(id){
  var pool = [
    {who:"@minhanh", text:"Mục 2 thay đổi cách tôi đọc báo luôn 😮"},
    {who:"@duy", text:"Đã fork hành trình này, học lại tuần sau!"},
    {who:"@lanchi", text:"Checkpoint khó thật nhưng đáng — không dán được 🙂"}
  ];
  var n = 1 + (id.charCodeAt(1) % pool.length);
  return pool.slice(0, n);
}

/* ---------------- S03 · Khám phá ---------------- */
var LAST_QUERY = "", PENDING_LEARN_CARD = null; // card đang học (để mở khoá 💜 "đã hiểu thật" sau checkpoint)
function searchVerdict(q){
  var n = q.toLowerCase();
  if(!n.trim()) return "clarify";
  if(n.indexOf("vũ khí")!==-1 || n.indexOf("bom")!==-1 || n.indexOf("ma túy")!==-1) return "blocked";
  if(n.indexOf("phản biện")!==-1 || n.indexOf("phan bien")!==-1) return "found";
  if(n.indexOf("tập trung")!==-1 || n.indexOf("tap trung")!==-1) return "related";
  return "missing";
}
ROUTES.discover = function(){
  var v = LAST_QUERY ? searchVerdict(LAST_QUERY) : null;
  if(v && S.searches.indexOf(LAST_QUERY + "|" + v) === -1){ S.searches.push(LAST_QUERY + "|" + v); save(); }
  var result = "";
  if(v === "clarify") result = verdictBox("clarify","🤔","Cần làm rõ","Mô tả thêm bạn muốn học điều gì — hoặc thử một chủ đề đang hot bên dưới.");
  else if(v === "blocked") result = verdictBox("blocked","⛔","Bị chặn bởi chính sách nội dung","Truy vấn vi phạm ranh giới an toàn. Sự kiện được ghi cho kiểm soát chất lượng.") + '<div class="row" style="margin-top:10px"><button class="btn sm ghost" type="button" data-act="report-ack">Tôi hiểu</button></div>';
  else if(v === "found") result = verdictBox("found","✅","Tìm thấy module khớp","\"Tư duy phản biện — nền tảng\" · 5 mục · 6 định dạng",
      '<button class="btn primary sm" type="button" data-nav="module">Mở module →</button>');

      '<div class="row">' + RELATED.slice(0,2).map(function(r){ return '<button class="btn sm ghost" type="button" data-act="rec-go" data-topic="' + esc(r.topic) + '">' + r.em + " " + esc(r.topic) + "</button>"; }).join("") + '</div><div class="row" style="margin-top:8px"><button class="btn gold sm" type="button" data-act="go-brew">🧪 Brew chủ đề của tôi</button></div>');
  else if(v === "missing") result = verdictBox("missing","🌱","Chưa ai Brew chủ đề này","Bạn sẽ là người đầu tiên — GON tổng hợp từ đầu vào của bạn thành module hoàn chỉnh.",
      '<button class="btn gold" type="button" data-act="go-brew">🧪 Brew Your Topic</button>');

    '<div class="search-hero">' +
      '<div class="search-row"><input type="search" id="uni-input" placeholder="Tìm hoặc dán link/file/ảnh… (vd: tư duy phản biện)" aria-label="Đầu vào học tập" value="' + esc(LAST_QUERY) + '">' +
      '<button class="btn primary" type="button" data-act="uni-search">Tìm</button></div>' +
      '<div class="attach-row">' +
        '<button class="attach-btn" type="button" data-act="attach" data-type="file">📄 Tệp</button>' +

function verdictBox(kind, icon, title, desc, extra){
  return '<div class="verdict ' + kind + '" style="margin-bottom:14px"><span style="font-size:1.5rem">' + icon + '</span><div style="flex:1"><b>' + title + '</b><p class="small muted" style="margin:4px 0 8px">' + desc + '</p>' + (extra||"") + '</div></div>';
}
function allCombos(){
  var pks = Object.keys(PERSONAS), dks = Object.keys(DEPTHS), list = [];
  dks.forEach(function(dk, di){
    pks.forEach(function(pk, pi){
      var o = OUTPUTS[(di*pks.length + pi) % OUTPUTS.length];
      list.push({persona:pk, depth:dk, out:o, score:o.scores[pk]});
    });
  });
  list.sort(function(a,b){ return b.score - a.score; });
  return list;
}
function allCombosBlock(){
  var combos = allCombos();
  return '<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">🎞️ ' + combos.length + ' tổ hợp Persona × Độ sâu</h3><span class="small muted">mặc định chạy tất cả</span></div>' +
    '<p class="small muted">GON <b>không hỏi bạn chọn persona hay độ sâu</b> — mọi tổ hợp đều được sinh và xếp hạng như feed TikTok. Output bạn chọn chính là <b>Persona đầu ra</b>, tín hiệu <b>Arena</b> và <b>dấu chân đẳng cấp</b> của bạn.</p>' +
    combos.map(function(c, i){
      var f = FORMATS[c.out.fmt], p = PERSONAS[c.persona], d = DEPTHS[c.depth], bars = "";
      for(var b=1;b<=10;b++) bars += '<i class="' + (b<=c.score?"on":"") + '"></i>';
      var chosen = S.picks.some(function(pk){ return pk.out === c.out.id; });
      return '<div class="out-item' + (i===0?" top":"") + '"><span class="rank">' + (i+1) + '</span><span class="fmt">' + f.em + '</span>' +
        '<div class="meta"><h4>' + esc(c.out.title) + '</h4><p>' + p.em + ' ' + p.label + ' · ' + d.em + ' ' + d.label + ' (' + d.desc + ') · ' + f.label + ' · ' + c.out.by + '</p><div class="score-bar">' + bars + '</div></div>' +
        (chosen ? '<span class="tag ok">👣 đã chọn</span>' : '<button class="btn sm primary" type="button" data-act="pick-output" data-p="' + c.persona + '" data-d="' + c.depth + '" data-o="' + c.out.id + '">Chọn</button>') +
        (i<3 && !chosen ? '<span class="tag ok">Đề xuất</span>' : "") + '</div>';
    }).join("") + '</div>';
}
function footprintCounts(){
  var c = {phd:0,kol:0,fun:0,adv:0}, d = {light:0,mid:0,deep:0};
  S.picks.forEach(function(p){ if(c[p.persona]!=null) c[p.persona]++; if(d[p.depth]!=null) d[p.depth]++; });
  return {p:c, d:d};
}
function footprintText(){
  if(!S.picks.length) return "chưa có — chọn một output trong Khám phá để bộc lộ persona";
  var fc = footprintCounts();
  var dom = Object.keys(fc.p).sort(function(a,b){ return fc.p[b]-fc.p[a]; })[0];
  return PERSONAS[dom].em + " " + PERSONAS[dom].label + " · 🌤️ " + fc.d.light + " Nhẹ / ☀️ " + fc.d.mid + " Vừa / 🌌 " + fc.d.deep + " Sâu (" + S.picks.length + " lựa chọn)";
}

      ? '<div class="okbox show">✅ Module sẵn sàng! 12 tổ hợp Persona × Độ sâu đã sinh trong khung bên dưới — output của bạn vừa trở thành topic trong <b>Bảng tin</b> (15 điểm xu hướng khởi đầu).</div>' +

        '<button class="btn ghost" type="button" data-nav="module">Mở module →</button></div>'
      : '<p class="small muted">Mô phỏng agent pipeline — production chạy Google ADK + Gemini thật.</p>') +
    '</div>';
}
function startBrew(){
  var topic = LAST_QUERY || "Chủ đề mới";
  BREW_STATE = {phase:"running"}; BREW_STEP = 0;
  render();
  var timer = setInterval(function(){
    BREW_STEP++;
    if(BREW_STEP >= 4){
      clearInterval(timer);
      BREW_STATE = {phase:"done"};
      S.brewed.push({topic:topic, t:Date.now(), trend:15});
      save();
      grantBadge("first_brew"); addXp(20, "Brew topic mới");
    }
    if(CURRENT === "discover" || CURRENT === "brew") render();
  }, 1000);
}

AFTER.learn = function(){
  var ta = document.getElementById("check-input"); if(!ta) return;
  ta.addEventListener("input", function(){ document.getElementById("char-n").textContent = ta.value.length; });
  ta.addEventListener("paste", function(){ document.getElementById("paste-warn").classList.add("show"); ta.dataset.pasted = "1"; });
};
function submitCheck(){
  var ta = document.getElementById("check-input");
  var v = ta.value.trim();
  if(ta.dataset.pasted === "1"){ document.getElementById("paste-warn").classList.add("show"); return; }
  if(v.length < 80){ openModal('<h3>Chưa đủ</h3><p>Cần tối thiểu 80 ký tự (hiện ' + v.length + ').</p><div class="row"><button class="btn primary" type="button" onclick="closeModal()">OK</button></div>'); return; }
  S.checks.push({q:"weak-argument", len:v.length, passed:true});
  if(PENDING_LEARN_CARD){ S.learnedCards[PENDING_LEARN_CARD] = 1; PENDING_LEARN_CARD = null; toast("💜 Đã mở khoá reaction \"Đã hiểu thật\" cho output này"); }
  save();
  document.getElementById("check-ok").classList.add("show");
  document.getElementById("paste-warn").classList.remove("show");
  grantBadge("first_proof"); addXp(30, "Vượt checkpoint hiểu thật");
  if(S.sectionsDone.indexOf(MODULE.sections[LEARN_SEC].i)===-1){ S.sectionsDone.push(MODULE.sections[LEARN_SEC].i); save(); }
}

function submitGame(){
  GAME_ANSWERS = [];

function startAgent(){
  if(AGENT_STATE.phase === "running") return;
  var topic = LAST_QUERY || "Chủ đề mới của tôi";
  AGENT_ORCH = ORCH_POOL[Math.floor(Math.random()*ORCH_POOL.length)];
  AGENT_STEP = 0;
  AGENT_VERDICT = searchVerdict(topic);
  AGENT_STATE = {phase:"running"};
  render();
  if(AGENT_TIMER) clearInterval(AGENT_TIMER);
  AGENT_TIMER = setInterval(function(){
    AGENT_STEP++;
    if(AGENT_STEP >= AGENT_STEPS.length){
      clearInterval(AGENT_TIMER);
      AGENT_STATE = {phase:"done"};
      S.agentJourneys.push({topic:topic, orch:AGENT_ORCH.name, recovered:AGENT_VERDICT !== "found", confirmed:null, t:Date.now()});
      save();
      addXp(25, "Journey Agent hoàn tất hành trình");
    }
    if(CURRENT === "discover") render();
  }, 800);
}

var FLOWS = [
  {id:"F1",name:"Đăng nhập ẩn danh (không cần tài khoản)",go:"login",need:"started"},
  {id:"F2",name:"Feed: like / comment / share tăng xu hướng",go:"feed",need:"social"},

  {id:"F5",name:"Học mục → checkpoint chống copy-paste",go:"module",need:"checked"},
  {id:"F6",name:"Xem ≥3/6 định dạng",go:"module",need:"formats3"},
  {id:"F7",name:"Mini-game đạt ≥2/3",go:"game",need:"game-pass"},

  {id:"F12",name:"Leaderboard (kiểu arena.ai): vote Arena → xếp hạng model + thứ hạng người học",go:"leaderboard",need:"lbviewed"},
  {id:"F13",name:"Remix output (persona reveal) + 💜 Đã hiểu thật (gated sau checkpoint)",go:"feed",need:"remixed"},
  {id:"F14",name:"Journey Agent (Agent Mode): 1 lệnh → trọn hành trình + phản hồi 5 tín hiệu",go:"discover",need:"agented"}
];
function flowDone(f){
  switch(f.need){
    case "started": return S.started;
    case "social": return Object.keys(S.likes).length>0 || Object.keys(S.comments).length>0;
    case "search-found": return S.searches.some(function(s){ return s.endsWith("|found"); });
    case "brewed": return S.brewed.length>0;
    case "checked": return S.checks.length>0;
    case "formats3": return S.formatsViewed.length>=3;
    case "game-pass": return S.gameBest!==null && S.gameBest>=2;
    case "forked": return S.forks.length>0;
    case "voted": return S.votes.length>0;
    case "trending": return S.brewed.some(function(b){ return b.trend>=40; });
    case "privacy": return S.visited.indexOf("profile")!==-1;
    case "lbviewed": return S.visited.indexOf("leaderboard")!==-1;
    case "remixed": return S.remixes.length>0;
    case "agented": return S.agentJourneys.length>0;
  }
  return false;
}
ROUTES.map = function(){
  var doneFlows = FLOWS.filter(flowDone).length;
  return '<div class="page"><div class="page-head"><button class="back-btn" type="button" data-nav="profile" aria-label="Quay lại">←</button><h1>📋 Sơ đồ xác nhận FE</h1></div>' +
    '<div class="card"><p class="small muted">Bấm lần lượt F1→F14 — mỗi flow ✓ là một phần Front End đã xác nhận.</p>' +
    '<div class="brew-visual" style="margin-top:10px"><i style="width:' + Math.round(doneFlows/FLOWS.length*100) + '%"></i></div>' +
    '<p class="small muted" style="margin-top:6px">Screens ' + S.visited.length + '/' + SCREENS.length + ' · Flows ' + doneFlows + '/' + FLOWS.length + ' · XP ' + lifetimeXp() + '</p></div>' +
    '<div class="card"><h3>Luồng chính</h3>' + FLOWS.map(function(f){
      var done = flowDone(f);
      return '<div class="flow-item' + (done?" done":"") + '"><span class="fn">' + f.id + '</span><div style="flex:1"><b>' + f.name + '</b></div>' +
        (done?'<span class="tag ok">✓</span>':'<span class="tag warn">chưa</span>') +
        '<button class="btn sm ghost" type="button" data-nav="' + f.go + '">Đi →</button></div>';
    }).join("") + '</div>' +
    '<div class="card"><h3>' + SCREENS.length + ' màn hình</h3><div class="grid3">' + SCREENS.map(function(s){
      var done = S.visited.indexOf(s.id)!==-1;
      return '<div class="journey-card" style="padding:10px"><b>' + s.num + "</b> · " + s.label +
        '<div style="margin-top:4px">' + (done?'<span class="tag ok">đã xem</span>':'<span class="tag info">chưa</span>') + '</div>' +
        '<button class="btn sm ghost" style="margin-top:6px" type="button" data-nav="' + s.id + '">Mở</button></div>';
    }).join("") + '</div></div></div>';
};

/* ---------------- Comment sheet ---------------- */
function openComments(cardId){
  var cards = feedCards().filter(function(c){ return c.id===cardId; });
  var c = cards[0] || FEED_SEED[0];
  var mock = mockComments(cardId);
  var mine = S.comments[cardId] || [];
  var all = mine.map(function(m){ return {who:"bạn", text:m.text}; }).concat(mock);
  openSheet('<div class="sheet-handle"></div>' +
    '<h3 style="margin:0 0 12px">💬 ' + all.length + ' bình luận · ' + esc(c.topic) + '</h3>' +
    all.map(function(m){ return '<div class="comment"><span class="av">' + (m.who==="bạn"?"B":m.who.slice(1,3).toUpperCase()) + '</span><div><b>' + esc(m.who) + '</b><p>' + esc(m.text) + '</p></div></div>'; }).join("") +
    '<div class="search-row" style="margin-top:8px"><input type="text" id="comment-input" placeholder="Thêm bình luận… (mock)">' +
    '<button class="btn primary" type="button" data-act="comment-send" data-card="' + cardId + '">Gửi</button></div>');
}
function sendComment(cardId){
  var el = document.getElementById("comment-input");
  var v = el ? el.value.trim() : "";
  if(!v) return;
  if(!S.comments[cardId]) S.comments[cardId] = [];
  S.comments[cardId].push({text:v}); save();
  boostCard(cardId, 6, "bình luận mới");
  grantBadge("social");
  closeSheet();
  toast("💬 Đã bình luận (mock) · +5 xu hướng");
}

var PENDING_ATTACHES = [];

  var host = document.getElementById("attached-list"); if(!host) return;

  }).join("");
}

  var actEl = e.target.closest("[data-act]");
  if(!actEl) return;
  var act = actEl.getAttribute("data-act");

  if(act === "anon-login"){
    S.started = true; S.account = makeAnonAccount(); save();

      '<div style="display:flex;flex-direction:column;gap:8px">' +
      '<button class="btn ghost" type="button" data-act="pick-account" data-name="Học Viên GON" data-email="hocvien@gon.demo">👤 Học Viên GON</button>' +
      '<button class="btn ghost" type="button" data-act="pick-account" data-name="Minh Khánh" data-email="minhkhanh@gmail.demo">👤 Minh Khánh</button></div>');
    return;
  }
  if(act === "pick-account"){
    S.started = true;
    S.account = {name:actEl.getAttribute("data-name"), email:actEl.getAttribute("data-email"),
      initials:actEl.getAttribute("data-name").split(" ").map(function(w){return w[0];}).join("").slice(0,2).toUpperCase(), anon:false, uuid:"google"};
    save(); closeModal(); nav("feed");
    toast("👋 Chào " + S.account.name + "!");
    return;
  }
  if(act === "resume-demo"){ nav("feed"); return; }
  if(act === "anon-help"){
    openModal('<h3>🌿 Hồ sơ ẩn danh là gì?</h3>' +
      '<p>Mỗi thiết bị được cấp một <b>UUID duy nhất</b>. Hồ sơ, cấp độ và tiến trình lưu ngay trên thiết bị — <b>không cần email hay mật khẩu</b>.</p>' +
      '<p class="small muted">Bạn có thể nâng cấp lên tài khoản thật (Google) bất cứ lúc nào để đồng bộ đa thiết bị. Trong demo này mọi thứ nằm trong IndexedDB trên thiết bị (PO 24/10: IndexedDB cho toàn bộ dự án).</p>' +
      '<div class="row"><button class="btn primary" type="button" onclick="closeModal()">Đã hiểu</button></div>');
    return;
  }

  if(act === "feedtab"){ FEED_TAB = actEl.getAttribute("data-t"); render(); return; }
  if(act === "like"){
    var lid = actEl.getAttribute("data-card");
    if(S.likes[lid]){ delete S.likes[lid]; toast("Đã bỏ tim"); }
    else { S.likes[lid] = 1; grantBadge("social"); boostCard(lid, 3, null); toast("❤️ Đã thả tim · +3 xu hướng"); }
    save(); render(); return;
  }
  if(act === "comment"){ openComments(actEl.getAttribute("data-card")); return; }
  if(act === "comment-send"){ sendComment(actEl.getAttribute("data-card")); return; }
  if(act === "share"){
    S.shares++; save();
    boostCard(actEl.getAttribute("data-card") || "c1", 4, "chia sẻ");
    openModal('<h3>Chia sẻ (mock)</h3><p>Production: chia sẻ topic/output của bạn ra Facebook/YouTube kèm liên kết về hành trình công khai — giúp topic lên xu hướng nhanh hơn.</p>' +
      '<div class="row"><button class="btn primary" type="button" onclick="closeModal()">Đã hiểu</button></div>');
    return;
  }
  if(act === "love"){
    var lid = actEl.getAttribute("data-card");
    if(!S.learnedCards[lid]){ toast("💜 Chưa mở khoá — hãy vượt checkpoint \"hiểu thật\" của output này trước (chống reaction ảo)"); return; }
    if(S.loves[lid]){ toast("Bạn đã thả 💜 cho output này rồi"); return; }
    var lcard = feedCards().filter(function(c){ return c.id===lid; })[0];
    S.loves[lid] = {topic: lcard ? lcard.topic : "", t:Date.now()};
    save(); boostCard(lid, 5, "được 💜 đã hiểu thật"); addXp(2, "Đã hiểu thật");
    return;
  }
  if(act === "remix"){
    var rid = actEl.getAttribute("data-card");
    var rcard = feedCards().filter(function(c){ return c.id===rid; })[0];
    if(!rcard) return;
    openSheet('<div class="sheet-handle"></div>' +
      '<h3 style="margin:0 0 8px">🎨 Remix "' + esc(rcard.topic) + '"</h3>' +
      '<p class="small muted">Chọn tổ hợp CỦA BẠN — mọi tổ hợp persona × độ sâu đều được sinh sẵn (quyết định PO 24/10). Lựa chọn này cũng là <b>persona bộc lộ</b> (dấu chân đẳng cấp) và tăng xu hướng cho output gốc của @' + esc(rcard.author) + '.</p>' +
      '<div class="row" style="margin-top:10px;flex-wrap:wrap">' + allCombos().map(function(cc){
        return '<button class="btn sm ghost" type="button" data-act="remix-pick" data-card="' + rid + '" data-p="' + cc.persona + '" data-d="' + cc.depth + '">' + PERSONAS[cc.persona].em + " " + PERSONAS[cc.persona].label + " · " + DEPTHS[cc.depth].em + " " + DEPTHS[cc.depth].label + '</button>';
      }).join("") + '</div>');

    var xcard = feedCards().filter(function(c){ return c.id===xid; })[0];
    var xper = actEl.getAttribute("data-p"), xdep = actEl.getAttribute("data-d");

      S.picks.push({out:"remix-" + xid + "-" + (S.remixes.length-1), title:xcard.topic, persona:xper, depth:xdep, t:Date.now()});

      boostCard(xid, 6, "được remix");

      render();

  if(act === "detach"){ PENDING_ATTACHES.splice(Number(actEl.getAttribute("data-i")),1); renderAttached(); return; }

    var v = (document.getElementById("uni-input").value || "").trim();

  if(act === "rec-go"){
    var topic = actEl.getAttribute("data-topic") || "";
    if(topic){ trackInput("text", topic); }
    LAST_QUERY = topic; BREW_STATE = {phase:"form"}; nav("discover"); return;
  }
  if(act === "topsearch"){ submitTopSearch(); return; }
  if(act === "lb-tab"){ LB_TAB = actEl.getAttribute("data-t") || "model"; render(); return; }
  if(act === "lb-fmt"){ LB_FMT = actEl.getAttribute("data-f") || "all"; render(); return; }
  if(act === "arena-next"){ ARENA_IDX = (ARENA_IDX + 1) % ARENA_PAIRS.length; render(); return; }
  if(act === "arena-embed-toggle"){ ARENA_EMBED_MODE = !ARENA_EMBED_MODE; render(); return; }
  if(act === "agent-run"){ startAgent(); return; }
  if(act === "agent-confirm"){
    var avv = actEl.getAttribute("data-v");
    var jj = S.agentJourneys[S.agentJourneys.length-1];
    if(!jj || jj.confirmed !== null) return;
    jj.confirmed = (avv === "ok");
    save();
    if(jj.confirmed){ addXp(5, "Confirmed success (Agent Mode)"); }
    else { toast("👎 Đã ghi nhận phản hồi chưa đạt — tín hiệu Praise vs complaint"); }
    render();
    return;
  }
  if(act === "report-ack"){ toast("🚦 Đã ghi nhận"); return; }
  if(act === "pick-output"){
    var pid = actEl.getAttribute("data-p"), did = actEl.getAttribute("data-d"), oid = actEl.getAttribute("data-o");
    var oo = OUTPUTS.filter(function(x){ return x.id === oid; })[0];
    if(oo && !S.picks.some(function(pk){ return pk.out === oid; })){
      S.picks.push({out:oid, title:oo.title, persona:pid, depth:did, t:Date.now()});

    render(); return;

  if(act === "go-brew"){ startBrew(); return; }

  if(act === "learn-sec"){ LEARN_SEC = Number(actEl.getAttribute("data-sec"))||0; nav("learn"); return; }
  if(act === "check-submit"){ submitCheck(); return; }
  if(act === "view-format"){ VIEW_FMT = {sec:Number(actEl.getAttribute("data-sec"))||0, fmt:actEl.getAttribute("data-fmt")}; nav("output"); return; }
  if(act === "video-play"){
    var vm = document.getElementById("video-mock");
    if(vm){ vm.classList.add("playing"); actEl.textContent = "⏸"; toast("▶ Đang phát video mô phỏng"); }
    return;
  }
  if(act === "game-submit"){ submitGame(); return; }
  if(act === "gd-blueprint"){ showGdBlueprint(); return; }
  if(act === "game-reset"){ GAME_ANSWERS=[]; GAME_SUBMITTED=false; GAME_SCORE=0; render(); return; }

  if(act === "vote"){ doVote(actEl.getAttribute("data-choice")); return; }
  if(act === "share-cert" || act === "download-cert" || act === "export-data"){ exportData(); return; }
  if(act === "delete-data"){ deleteData(); return; }
  if(act === "delete-confirm"){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    S = JSON.parse(JSON.stringify(DEFAULT_STATE));
    PENDING_ATTACHES = []; LAST_QUERY = ""; GAME_ANSWERS = []; GAME_SUBMITTED = false; FEED_TAB = "hot";
    var afterWipe = function(){ closeModal(); nav("login"); render(); toast("🗑 Đã xoá dữ liệu demo (IndexedDB + localStorage)"); };
    if(idbAvailable()){ idbClear(afterWipe); } else { afterWipe(); }
    return;
  }
  if(act === "reset-demo"){
    openModal('<h3>Reset demo?</h3><div class="row"><button class="btn danger" type="button" data-act="delete-confirm">Reset</button><button class="btn ghost" type="button" onclick="closeModal()">Huỷ</button></div>');
    return;
  }
});

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
