<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="GON — Standalone Front-End Confirmation Demo. Toàn bộ màn hình và luồng, dữ liệu mô phỏng, không gọi backend thật.">
<title>GON — Xác nhận Front End (Standalone Demo)</title>
<style>
/* ============ GON design tokens (map từ gon-tokens.json / P02 prototype) ============ */
:root{
  --midnight:#101b33; --midnight-2:#172541; --midnight-3:#203355;
  --emerald:#12b981; --gold:#ffc531; --gold-strong:#b77900; --crimson:#d22630;
  --cyan:#28b9d8; --violet:#7c5cff;
  --paper:#f7f8fb; --card:#ffffff; --ink:#182233; --muted:#65738a;
  --line:rgba(187,201,228,.18); --line-light:#e6eaf2;
  --radius-s:10px; --radius-m:16px; --radius-l:24px;
  --shadow:0 24px 60px rgba(0,0,0,.24);
  --max:1240px; --touch:44px;
  font-family:"Be Vietnam Pro",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:#f4f7ff;background:
  radial-gradient(circle at 10% -10%,rgba(124,92,255,.32),transparent 34rem),
  radial-gradient(circle at 92% 12%,rgba(18,185,129,.18),transparent 30rem),
  var(--midnight);
  font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:44px 44px;}
button,input,select,textarea{font:inherit}
button{min-height:var(--touch);cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:8px;left:8px;z-index:100;padding:12px 16px;border-radius:999px;background:var(--gold);color:var(--ink);transform:translateY(-200%);text-decoration:none;font-weight:700}
.skip-link:focus{transform:none}

/* ============ Banner + topbar ============ */
.demo-banner{position:relative;z-index:20;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;
  padding:10px max(18px,calc((100vw - var(--max))/2));background:var(--gold);color:var(--ink);font-size:.85rem}
.demo-banner strong{letter-spacing:.4px}
.topbar{position:sticky;top:0;z-index:15;display:flex;gap:14px;align-items:center;
  width:min(var(--max),calc(100% - 28px));margin:14px auto 0;padding:10px 14px;
  border:1px solid var(--line);border-radius:20px;background:rgba(16,27,51,.92);backdrop-filter:blur(18px)}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit}
.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;
  background:linear-gradient(135deg,var(--emerald),var(--cyan));color:#06251b;font-weight:800;font-size:1.15rem}
.brand small{display:block;color:var(--muted);font-size:.62rem;letter-spacing:1.6px}
.level-chip{margin-left:auto;display:flex;flex-direction:column;gap:2px;padding:6px 12px;border:1px solid var(--line);
  border-radius:14px;background:var(--midnight-2);min-width:150px}
.level-chip b{font-size:.92rem}
.level-chip span{font-size:.72rem;color:var(--muted)}
.mini-progress{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.mini-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--emerald),var(--gold));border-radius:99px;transition:width .5s}
.avatar-button{width:44px;height:44px;border-radius:50%;border:2px solid var(--cyan);background:var(--violet);
  color:#fff;font-weight:700;font-size:.9rem}

/* ============ Layout ============ */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;
  width:min(var(--max),calc(100% - 28px));margin:18px auto 60px}
.sidebar{position:sticky;top:96px;align-self:start;padding:14px;border:1px solid var(--line);border-radius:var(--radius-m);background:rgba(23,37,65,.75)}
.nav-label{margin:4px 0 8px;color:var(--muted);font-size:.72rem;letter-spacing:1.4px;text-transform:uppercase}
.side-nav{display:flex;flex-direction:column;gap:3px;max-height:62vh;overflow:auto}
.nav-item{display:flex;gap:8px;align-items:center;width:100%;padding:8px 10px;border:0;border-radius:10px;
  background:transparent;color:#dfe7f7;text-align:left;font-size:.88rem}
.nav-item:hover{background:rgba(255,255,255,.06)}
.nav-item.active{background:rgba(18,185,129,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(18,185,129,.45)}
.nav-item .num{width:24px;color:var(--muted);font-size:.7rem;font-weight:700}
.nav-item .done{margin-left:auto;font-size:.78rem}
.nav-progress{margin-top:10px;font-size:.75rem;color:var(--muted)}
main{min-width:0}

/* ============ Cards / primitives ============ */
.card{padding:22px;border:1px solid var(--line);border-radius:var(--radius-m);background:rgba(23,37,65,.66);margin-bottom:18px}
.card.light{background:var(--card);color:var(--ink);border-color:var(--line-light)}
.screen-title{margin:0 0 4px;font-size:1.45rem;letter-spacing:-.4px}
.screen-sub{margin:0 0 18px;color:var(--muted);font-size:.92rem}
.kicker{display:inline-block;margin-bottom:8px;padding:3px 10px;border-radius:99px;background:rgba(40,185,216,.14);
  color:var(--cyan);font-size:.72rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;padding:10px 18px;border:1px solid transparent;
  border-radius:12px;background:var(--midnight-3);color:#fff;font-weight:600;text-decoration:none}
.btn.primary{background:linear-gradient(135deg,var(--emerald),#0d9668);color:#04241a}
.btn.gold{background:var(--gold);color:#3d2b00}
.btn.ghost{background:transparent;border-color:var(--line);color:#dfe7f7}
.btn.danger{background:var(--crimson);color:#fff}
.btn.sm{padding:6px 12px;font-size:.82rem;min-height:36px}
.btn.google{background:#fff;color:#1f2937;border:0;font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border:1px solid var(--line);border-radius:99px;
  background:rgba(255,255,255,.05);font-size:.78rem;color:#cfd9ec}
.chip.on{border-color:var(--emerald);background:rgba(18,185,129,.14);color:#9ff0cf}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.7rem;font-weight:700}
.tag.ok{background:rgba(18,185,129,.16);color:#7fe9bd}
.tag.warn{background:rgba(255,197,49,.16);color:#ffd977}
.tag.bad{background:rgba(210,38,48,.18);color:#ff9aa1}
.tag.info{background:rgba(40,185,216,.15);color:#8fdcf0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}
ul.tick{list-style:none;padding:0;margin:0}
ul.tick li{padding:5px 0 5px 26px;position:relative}
ul.tick li::before{content:"✓";position:absolute;left:2px;color:var(--emerald);font-weight:800}

/* ============ Forms ============ */
label.field{display:block;margin-bottom:14px}
label.field>span{display:block;margin-bottom:6px;font-size:.84rem;color:#cfd9ec}
input[type=text],input[type=search],textarea,select{width:100%;padding:11px 14px;border:1px solid var(--line);
  border-radius:12px;background:rgba(10,16,31,.6);color:#f4f7ff}
textarea{min-height:110px;resize:vertical}
.light input[type=text],.light textarea,.light select{background:#fff;color:var(--ink);border-color:var(--line-light)}
.checkline{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);margin-bottom:10px;cursor:pointer}
.checkline input{width:20px;height:20px;accent-color:var(--emerald);margin-top:2px}
.warnbox{display:none;margin-top:10px;padding:12px 14px;border:1px solid rgba(255,197,49,.4);border-radius:12px;background:rgba(255,197,49,.1);color:#ffd977;font-size:.86rem}
.warnbox.show{display:block}
.okbox{display:none;margin-top:10px;padding:12px 14px;border:1px solid rgba(18,185,129,.4);border-radius:12px;background:rgba(18,185,129,.1);color:#9ff0cf;font-size:.86rem}
.okbox.show{display:block}

/* ============ Welcome ============ */
.hero{padding:56px 30px;text-align:center;border:1px solid var(--line);border-radius:var(--radius-l);
  background:radial-gradient(circle at 50% -20%,rgba(124,92,255,.35),transparent 26rem),rgba(23,37,65,.7)}
.hero .brand-mark{width:76px;height:76px;border-radius:24px;font-size:2rem;margin:0 auto 14px}
.hero h1{margin:6px 0 6px;font-size:2.3rem;letter-spacing:-1px}
.hero p.lead{max-width:640px;margin:0 auto 26px;color:#cfd9ec}
.steps-preview{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.age-notice{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:99px;
  background:rgba(210,38,48,.15);color:#ff9aa1;font-weight:700;font-size:.8rem;letter-spacing:1px}

/* ============ Universal input ============ */
.universal{display:flex;flex-direction:column;gap:12px}
.universal .input-row{display:flex;gap:10px}
.universal input{flex:1}
.attach-row{display:flex;flex-wrap:wrap;gap:8px}
.attach-btn{padding:7px 13px;border:1px dashed var(--line);border-radius:99px;background:transparent;color:#cfd9ec;font-size:.8rem}
.attach-btn:hover{border-color:var(--cyan);color:#fff}
.attached{display:flex;flex-wrap:wrap;gap:8px}
.attached .chip{border-style:solid;border-color:var(--cyan)}

/* ============ Trending rail (TikTok-style) ============ */
.rail{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{height:8px}
.rail::-webkit-scrollbar-thumb{background:var(--midnight-3);border-radius:99px}
.trend-card{scroll-snap-align:start;flex:0 0 230px;position:relative;min-height:300px;padding:16px;
  border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;cursor:pointer;
  background:linear-gradient(160deg,var(--midnight-3),var(--midnight-2));display:flex;flex-direction:column;justify-content:flex-end}
.trend-card:hover{transform:translateY(-3px);transition:.2s}
.trend-card .heat{position:absolute;top:12px;right:12px;font-size:.72rem;font-weight:800;color:var(--gold)}
.trend-card .emoji{position:absolute;top:34px;left:16px;font-size:2.6rem;filter:saturate(.9)}
.trend-card h4{margin:0 0 6px;font-size:.98rem}
.trend-card p{margin:0;font-size:.78rem;color:var(--muted)}
.trend-card .rise{margin-top:10px;font-size:.72rem;color:#7fe9bd;font-weight:700}

/* ============ Search verdicts ============ */
.verdict{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:var(--radius-m);border:1px solid var(--line)}
.verdict.found{background:rgba(18,185,129,.1);border-color:rgba(18,185,129,.4)}
.verdict.related{background:rgba(40,185,216,.1);border-color:rgba(40,185,216,.4)}
.verdict.missing{background:rgba(255,197,49,.08);border-color:rgba(255,197,49,.4)}
.verdict.clarify{background:rgba(124,92,255,.1);border-color:rgba(124,92,255,.4)}
.verdict.blocked{background:rgba(210,38,48,.12);border-color:rgba(210,38,48,.45)}
.verdict .icon{font-size:1.6rem}

/* ============ Persona tabs + outputs ============ */
.persona-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.persona-tab{padding:9px 16px;border:1px solid var(--line);border-radius:99px;background:transparent;color:#cfd9ec;font-size:.86rem}
.persona-tab[aria-selected=true]{background:linear-gradient(135deg,var(--violet),#5a3df0);color:#fff;border-color:transparent}
.out-item{display:flex;gap:14px;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:rgba(16,27,51,.5);margin-bottom:10px}
.out-item .rank{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--midnight-3);font-weight:800;font-size:.85rem}
.out-item.top .rank{background:var(--gold);color:#3d2b00}
.out-item .fmt{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;background:rgba(124,92,255,.18)}
.out-item .meta{flex:1;min-width:0}
.out-item h4{margin:0;font-size:.94rem}
.out-item p{margin:2px 0 0;font-size:.76rem;color:var(--muted)}
.score-bar{display:flex;gap:2px;margin-top:6px}
.score-bar i{height:5px;flex:1;border-radius:2px;background:rgba(255,255,255,.12)}
.score-bar i.on{background:var(--emerald)}

/* ============ Brew pipeline ============ */
.pipeline{display:grid;gap:12px;margin:18px 0}
.pipe-step{display:flex;gap:12px;align-items:center;padding:13px 16px;border:1px solid var(--line);border-radius:14px;opacity:.42;transition:.35s}
.pipe-step.active{opacity:1;border-color:var(--cyan);background:rgba(40,185,216,.08)}
.pipe-step.done{opacity:1;border-color:rgba(18,185,129,.5)}
.pipe-step .st-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--midnight-3);font-size:1.1rem}
.pipe-step .spinner{width:18px;height:18px;margin-left:auto;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--cyan);animation:spin 1s linear infinite;display:none}
.pipe-step.active .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.brew-visual{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.brew-visual i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--cyan),var(--emerald));transition:width .4s}

/* ============ Module / learn ============ */
.section-item{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:rgba(16,27,51,.5)}
.section-item .idx{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;background:var(--midnight-3)}
.section-item.done{border-color:rgba(18,185,129,.45)}
.section-item .fmt-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fmt-chip{padding:3px 10px;border-radius:99px;font-size:.68rem;font-weight:700;background:rgba(124,92,255,.15);color:#c9bcff;border:0}
.lesson-prose{max-width:70ch}
.lesson-prose p{color:#dbe4f5}
.callout{padding:14px 16px;border-left:3px solid var(--gold);background:rgba(255,197,49,.07);border-radius:0 12px 12px 0;margin:14px 0}
.char-count{font-size:.75rem;color:var(--muted);text-align:right;margin-top:4px}

/* ============ Infographic / video / image mocks ============ */
.info-steps{display:flex;flex-direction:column;gap:10px}
.info-step{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;color:var(--ink);font-weight:600}
.info-step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(16,27,51,.85);color:var(--gold);font-weight:800}
.video-mock{position:relative;padding-top:56.25%;border-radius:var(--radius-m);overflow:hidden;background:linear-gradient(135deg,#0b1230,#1d1145);border:1px solid var(--line)}
.video-mock .play{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;color:#fff;background:rgba(0,0,0,.25);border:0}
.video-mock .bar{position:absolute;left:12px;right:12px;bottom:12px;height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.video-mock .bar i{display:block;height:100%;width:0;background:var(--crimson)}
.video-mock.playing .bar i{animation:fillbar 12s linear forwards}
@keyframes fillbar{to{width:100%}}
.img-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.img-card{aspect-ratio:4/3;border-radius:14px;display:grid;place-items:center;font-size:.8rem;color:#fff;text-align:center;padding:10px}

/* ============ Game ============ */
.q-card{padding:16px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;background:rgba(16,27,51,.5)}
.q-card h4{margin:0 0 10px;font-size:.95rem}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer;font-size:.88rem}
.opt:hover{border-color:var(--cyan)}
.opt input{accent-color:var(--violet)}
.opt.correct{border-color:var(--emerald);background:rgba(18,185,129,.12)}
.opt.wrong{border-color:var(--crimson);background:rgba(210,38,48,.12)}

/* ============ Progress ============ */
.level-hero{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.level-ring{--pct:0;width:150px;height:150px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--emerald) calc(var(--pct)*1%), rgba(255,255,255,.08) 0);position:relative}
.level-ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--midnight-2)}
.level-ring .inner{position:relative;text-align:center}
.level-ring .inner b{display:block;font-size:2rem}
.mastery-row{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.mastery-row .bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.mastery-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.xp-table{width:100%;border-collapse:collapse;font-size:.85rem}
.xp-table th,.xp-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.xp-table th{color:var(--muted);font-weight:600}
.xp-table td.amt{color:#7fe9bd;font-weight:700;text-align:right}

/* ============ Related / fork ============ */
.journey-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(16,27,51,.5)}
.journey-card h4{margin:0 0 6px}
.fork-note{display:flex;gap:8px;align-items:center;font-size:.75rem;color:var(--muted)}
.avatar-mini{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.66rem;font-weight:800;background:var(--violet);color:#fff}

/* ============ Arena ============ */
.arena-stage{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
.arena-card{padding:18px;border:1px solid var(--line);border-radius:var(--radius-m);background:rgba(16,27,51,.6);display:flex;flex-direction:column;gap:10px}
.arena-card.chosen{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.arena-vs{display:grid;place-items:center;font-size:1.5rem;font-weight:900;color:var(--gold)}
.reveal{display:none;margin-top:6px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.05);font-size:.8rem}
.reveal.show{display:block}
.split-bar{display:flex;height:26px;border-radius:99px;overflow:hidden;font-size:.75rem;font-weight:800;color:#06251b}
.split-bar .a{background:var(--emerald);display:grid;place-items:center}
.split-bar .b{background:var(--gold);display:grid;place-items:center;color:#3d2b00}

/* ============ Proof / POAP ============ */
.timeline{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:8px 0 14px}
.timeline li::before{content:"";position:absolute;left:-29px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--cyan);border:3px solid var(--midnight)}
.timeline .t-meta{font-size:.72rem;color:var(--muted)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{padding:14px 10px;text-align:center;border:1px solid var(--line);border-radius:14px;background:rgba(16,27,51,.5)}
.badge .em{font-size:1.9rem;display:block;filter:grayscale(1) opacity(.4)}
.badge.unlocked .em{filter:none}
.badge b{display:block;font-size:.8rem;margin-top:6px}
.badge span{font-size:.68rem;color:var(--muted)}
.cert{padding:24px;border:2px dashed var(--gold);border-radius:var(--radius-m);text-align:center;background:rgba(255,197,49,.05)}
.cert .cert-title{font-size:1.2rem;font-weight:800;letter-spacing:2px;color:var(--gold)}

/* ============ Map ============ */
.flow-item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:13px;margin-bottom:9px;background:rgba(16,27,51,.5)}
.flow-item .fn{width:44px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--midnight-3);font-weight:800;font-size:.8rem}
.flow-item.done{border-color:rgba(18,185,129,.4)}

/* ============ Toast + modal ============ */
#toasts{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:13px;background:#0c1428f2;
  border:1px solid var(--line);box-shadow:var(--shadow);font-size:.88rem;animation:pop .25s}
.toast.xp{border-color:var(--emerald)}
.toast.badge-toast{border-color:var(--gold)}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
#modal-overlay{position:fixed;inset:0;z-index:95;display:none;place-items:center;background:rgba(5,9,20,.72);padding:18px}
#modal-overlay.show{display:grid}
.modal{width:min(560px,100%);max-height:86vh;overflow:auto;padding:26px;border-radius:var(--radius-l);
  background:var(--midnight-2);border:1px solid var(--line);box-shadow:var(--shadow)}
.modal h3{margin:0 0 10px}

/* ============ Responsive ============ */
@media (max-width:920px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:static}
  .side-nav{flex-direction:row;flex-wrap:wrap;max-height:none}
  .nav-item{width:auto}
  .arena-stage{grid-template-columns:1fr}
  .arena-vs{padding:4px 0}
}

/* =====================================================================
   GON — Standalone Front-End Confirmation Demo
   - Mọi dữ liệu là mô phỏng (mock) trong trình duyệt.
   - Không network call. Trạng thái lưu localStorage (có nút reset).
   - Level suốt đời: floor(LifetimeXP / 100), KHÔNG giới hạn (uncapped);
     Kỷ nguyên Forever mở ở Lv.35+ theo White Paper 1.0.
   ===================================================================== */

/* ---------------- Trạng thái ---------------- */
var STORAGE_KEY = "gon-standalone-fe-demo-v1";
var DEFAULT_STATE = {
  started: false,
  account: null,
  xpLedger: [],
  visited: [],
  inputs: [],        // lịch sử đầu vào: {type, value, t}
  searches: [],      // {query, verdict, t}
  checks: [],        // checkpoint hiểu thật: {q, len, passed, paste}
  votes: [],         // {choice}
  forks: [],         // {topic, from, t}
  badges: [],
  gameBest: null,
  formatsViewed: [],
  sectionsDone: [],
  brewed: [],        // {topic, persona, t}
  personalization: true
};

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    var s = JSON.parse(raw), out = JSON.parse(JSON.stringify(DEFAULT_STATE)), k;
    for(k in s){ if(Object.prototype.hasOwnProperty.call(out, k)) out[k] = s[k]; }
    return out;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }catch(e){} }
var S = loadState();

function lifetimeXp(){ return S.xpLedger.reduce(function(a,e){ return a + e.amount; }, 0); }
function level(){ return Math.floor(lifetimeXp() / 100); }
function levelPct(){ return (lifetimeXp() % 100); }
function eraName(){
  var lv = level();
  if(lv >= 35) return "FOREVER — kỷ nguyên mở";
  if(lv >= 20) return "Kiến tạo trưởng thành";
  if(lv >= 10) return "Học viên nghiêm túc";
  if(lv >= 1)  return "Mầm mống";
  return "Khởi đầu";
}

/* ---------------- XP / huy hiệu / thông báo ---------------- */
function toast(msg, cls){
  var box = document.getElementById("toasts");
  var t = document.createElement("div");
  t.className = "toast " + (cls || "");
  t.innerHTML = msg;
  box.appendChild(t);
  setTimeout(function(){ t.remove(); }, 4200);
}
function addXp(amount, reason){
  var before = level();
  S.xpLedger.push({ t: Date.now(), amount: amount, reason: reason });
  save(); renderHeader();
  toast("+" + amount + " XP · " + reason, "xp");
  var after = level();
  if(after > before){
    openModal('<h3>🎉 Lên cấp!</h3><p>Bạn đạt <b>Lv.' + after + '</b> — ' + eraName() + '.</p>' +
      '<p class="small muted">Công thức: <span class="mono">floor(LifetimeXP / 100)</span> = floor(' + lifetimeXp() + ' / 100) = ' + after +
      ' · cấp suốt đời <b>không giới hạn</b>; kỷ nguyên Forever mở ở Lv.35+.</p>' +
      '<div class="row"><button class="btn primary" type="button" onclick="closeModal()">Tuyệt</button></div>');
  }
}

/* ---------------- S03 · Tìm kiếm ---------------- */
function searchVerdict(q){
  var n = q.toLowerCase();
  if(!n.trim()) return "clarify";
  if(n.indexOf("vũ khí") !== -1 || n.indexOf("bom") !== -1 || n.indexOf("ma túy") !== -1) return "blocked";
  if(n.indexOf("phản biện") !== -1 || n.indexOf("phan bien") !== -1) return "found";
  if(n.indexOf("tập trung") !== -1 || n.indexOf("tap trung") !== -1) return "related";
  return "missing";
}
var LAST_QUERY = "";
var CURRENT_PERSONA = "phd";

ROUTES.search = function(){
  var q = LAST_QUERY;
  var v = searchVerdict(q);
  if(S.searches.indexOf(q + "|" + v) === -1){ S.searches.push(q + "|" + v); save(); }
  var head = '<span class="kicker">S03 · Kết quả tìm kiếm</span>' +
    '<h2 class="screen-title">' + (q ? '"' + esc(q) + '"' : "Tìm kiếm") + '</h2>' +
    '<p class="screen-sub">Đầu vào của bạn vừa là truy vấn, vừa là ngữ cảnh học — GON đối chiếu cả hai với chỉ mục ngữ nghĩa 768 chiều (mô phỏng).</p>';
  var box = "";
  if(v === "clarify"){
    box = '<div class="verdict clarify"><span class="icon">🤔</span><div><b>Cần làm rõ</b><p class="small muted">Hãy mô tả thêm bạn muốn học điều gì — hoặc chọn một chủ đề trending ở S02.</p></div></div>';
  } else if(v === "blocked"){
    box = '<div class="verdict blocked"><span class="icon">⛔</span><div><b>Bị chặn bởi chính sách nội dung</b>' +
      '<p class="small muted">Truy vấn vi phạm ranh giới an toàn 18+ (không hướng dẫn tự gây hại). Sự kiện được ghi cho mục đích kiểm soát chất lượng.</p>' +
      '<div class="row"><button class="btn sm ghost" type="button" data-act="report-ack">Tôi hiểu — báo cáo đã ghi</button></div></div></div>';
  } else if(v === "found"){
    box = '<div class="verdict found"><span class="icon">✅</span><div><b>Tìm thấy module khớp</b>' +
      '<p class="small muted">"Tư duy phản biện — nền tảng" · 5 mục · 6 định dạng · cập nhật 2 giờ trước</p>' +

AFTER.learn = function(){
  var ta = document.getElementById("check-input");
  var n = document.getElementById("char-n");
  if(!ta) return;
  ta.addEventListener("input", function(){ n.textContent = ta.value.length; });
  ta.addEventListener("paste", function(){
    document.getElementById("paste-warn").classList.add("show");
    ta.dataset.pasted = "1";
  });
};
function submitCheck(){
  var ta = document.getElementById("check-input");
  var v = ta.value.trim();
  var pasted = ta.dataset.pasted === "1";
  if(pasted){ document.getElementById("paste-warn").classList.add("show"); document.getElementById("check-ok").classList.remove("show"); return; }
  if(v.length < 80){
    openModal('<h3>Chưa đủ</h3><p>Cần tối thiểu 80 ký tự (hiện ' + v.length + '). Diễn giải sâu hơn một chút nhé.</p><div class="row"><button class="btn primary" type="button" onclick="closeModal()">OK</button></div>');
    return;
  }
  S.checks.push({ q: "weak-argument", len: v.length, passed: true, paste: false }); save();
  document.getElementById("check-ok").classList.add("show");
  document.getElementById("paste-warn").classList.remove("show");
  grantBadge("first_proof"); addXp(30, "Vượt checkpoint hiểu thật");
  var next = MODULE.sections[LEARN_SEC];
  if(S.sectionsDone.indexOf(next.i) === -1){ S.sectionsDone.push(next.i); save(); }
}

var GAME_SUBMITTED = false, GAME_SCORE = 0;
function submitGame(){
  GAME_ANSWERS = [];
  for(var qi = 0; qi < GAME_QUESTIONS.length; qi++){
    var sel = document.querySelector('input[name="gq' + qi + '"]:checked');
    if(!sel){ openModal('<h3>Chưa chọn hết</h3><p>Bạn còn câu chưa chọn. (Demo cho phép nộp khi đã chọn cả 3 câu.)</p><div class="row"><button class="btn primary" onclick="closeModal()">OK</button></div>'); return; }

function inputEm(t){ return { text:"📝", file:"📄", image:"🖼️", youtube:"▶️", facebook:"📘", web:"🌐" }[t] || "📝"; }
function inputLabel(t){ return { text:"Văn bản", file:"Tệp", image:"Ảnh", youtube:"YouTube", facebook:"Facebook", web:"Website" }[t] || t; }
function verdictVi(v){ return { found:"có sẵn", related:"liên quan", missing:"chưa có", clarify:"cần làm rõ", blocked:"bị chặn" }[v] || v; }

/* ---------------- S13 · Hồ sơ & quyền riêng tư ---------------- */

};
AFTER.profile = function(){
  var ck = document.getElementById("ck-personalization");
  if(!ck) return;
  ck.addEventListener("change", function(){ S.personalization = ck.checked; save(); toast(S.personalization ? "🟢 Cá nhân hóa: BẬT" : "🔴 Cá nhân hóa: TẮT"); });
};
function exportData(){
  var blob = new Blob([JSON.stringify(S, null, 2)], { type:"application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "gon-demo-data-export.json";
  a.click();
  toast("⬇ Đã xuất dữ liệu demo (JSON)");
}
function deleteData(){
  openModal('<h3>Xoá dữ liệu demo?</h3><p>Hành động này xoá localStorage của demo: XP, huy hiệu, lịch sử đầu vào… (mock của luồng production "xoá tài khoản & dữ liệu")</p>' +
    '<div class="row"><button class="btn danger" type="button" data-act="delete-confirm">Xoá ngay</button><button class="btn ghost" type="button" onclick="closeModal()">Huỷ</button></div>');
}

/* ---------------- S14 · Sơ đồ màn hình & luồng ---------------- */
var FLOWS = [
  { id:"F1",  name:"Đăng nhập 18+ → Google (mock)",        go:"welcome",   need:"started" },
  { id:"F2",  name:"Input phổ quát → tìm thấy module",      go:"home",      need:"search-found" },
  { id:"F3",  name:"Tìm yếu → Brew Your Topic → module mới", go:"home",     need:"brewed" },
  { id:"F4",  name:"Học mục → checkpoint chống copy-paste",  go:"module",   need:"checked" },
  { id:"F5",  name:"Xem ≥3/6 định dạng GDevelop",           go:"module",   need:"formats3" },
  { id:"F6",  name:"Mini-game easy-task đạt ≥2/3",          go:"game",     need:"game-pass" },
  { id:"F7",  name:"Fork một hành trình (GitHub-style)",    go:"related",  need:"forked" },
  { id:"F8",  name:"Bình chọn Arena → mở nhãn model",       go:"arena",    need:"voted" },
  { id:"F9",  name:"Trending → chủ đề mới",                 go:"home",     need:"searched" },
  { id:"F10", name:"POAP + chia sẻ chứng nhận",             go:"proof",    need:"badges2" },
  { id:"F11", name:"Quyền riêng tư: xuất & xoá dữ liệu",    go:"profile",  need:"privacy" }
];
function flowDone(f){
  switch(f.need){
    case "started":   return S.started;
    case "search-found": return S.searches.some(function(s){ return s.endsWith("|found"); });
    case "brewed":    return S.brewed.length > 0;
    case "checked":   return S.checks.length > 0;
    case "formats3":  return S.formatsViewed.length >= 3;
    case "game-pass": return S.gameBest !== null && S.gameBest >= 2;
    case "forked":    return S.forks.length > 0;
    case "voted":     return S.votes.length > 0;
    case "searched":  return S.searches.length > 0;
    case "badges2":   return S.badges.length >= 2;
    case "privacy":   return S.visited.indexOf("profile") !== -1;
  }
  return false;
}
ROUTES.map = function(){
  var doneFlows = FLOWS.filter(flowDone).length;
  var doneScreens = S.visited.length;
  return '<span class="kicker">S14 · Sơ đồ xác nhận</span>' +
    '<h2 class="screen-title">Danh mục màn hình & luồng để bạn xác nhận</h2>' +
    '<p class="screen-sub">Đây là trang "checklist duyệt": bấm từng luồng theo thứ tự F1→F11, mỗi bước ✓ là một phần Front End đã được xác nhận.</p>' +
    '<div class="card"><div class="row" style="justify-content:space-between">' +
      '<div><h3 style="margin:0">Tiến độ xác nhận</h3><p class="small muted">Screens ' + doneScreens + '/' + SCREENS.length + ' · Flows ' + doneFlows + '/' + FLOWS.length + ' · XP ' + lifetimeXp() + '</p></div>' +
      '<div class="row"><button class="btn ghost" type="button" data-act="reset-demo">↺ Reset demo</button>' +
      '<button class="btn ghost" type="button" data-act="export-data">⬇ Xuất bằng chứng duyệt (JSON)</button></div>' +
    '</div>' +
    '<div class="brew-visual" style="margin-top:14px"><i style="width:' + Math.round((doneFlows / FLOWS.length) * 100) + '%"></i></div></div>' +
    '<div class="card"><h3>Luồng chính F1–F11</h3>' +
      FLOWS.map(function(f){
        var done = flowDone(f);
        return '<div class="flow-item' + (done ? " done" : "") + '"><span class="fn">' + f.id + '</span>' +
          '<div style="flex:1"><b>' + f.name + '</b></div>' +
          (done ? '<span class="tag ok">đã trải ✓</span>' : '<span class="tag warn">chưa</span>') +
          '<button class="btn sm ghost" type="button" data-nav="' + f.go + '">Đi tới →</button></div>';
      }).join("") + '</div>' +
    '<div class="card"><h3>14 màn hình (S01–S14)</h3><div class="grid3">' +
      SCREENS.map(function(s){
        var done = S.visited.indexOf(s.id) !== -1;
        return '<div class="journey-card' + (done ? "" : "") + '" style="padding:12px"><b>' + s.num + "</b> · " + s.label +
          '<div style="margin-top:6px">' + (done ? '<span class="tag ok">đã xem</span>' : '<span class="tag info">chưa xem</span>') + '</div>' +
          '<button class="btn sm ghost" style="margin-top:8px" type="button" data-nav="' + s.id + '">Mở</button></div>';
      }).join("") + '</div></div>';
};

/* ---------------- Uỷ quyền click toàn cục ---------------- */
document.addEventListener("click", function(e){
  var navEl = e.target.closest("[data-nav]");
  if(navEl){ nav(navEl.getAttribute("data-nav")); return; }
  var actEl = e.target.closest("[data-act]");
  if(!actEl) return;
  var act = actEl.getAttribute("data-act");

  if(act === "google-signin"){
    openModal('<h3>Chọn tài khoản Google</h3><p class="small muted">Mô phỏng OAuth — demo không gửi dữ liệu đi đâu.</p>' +
      '<div class="row" style="flex-direction:column;align-items:stretch;gap:8px">' +
      '<button class="btn ghost" type="button" data-act="pick-account" data-name="Học Viên GON" data-email="hocvien@gon.demo">👤 Học Viên GON (hocvien@gon.demo)</button>' +
      '<button class="btn ghost" type="button" data-act="pick-account" data-name="Minh Khánh" data-email="minhkhanh@gmail.demo">👤 Minh Khánh (minhkhanh@gmail.demo)</button>' +
      '</div>');
    return;
  }
  if(act === "pick-account"){
    S.started = true;
    S.account = { name: actEl.getAttribute("data-name"), email: actEl.getAttribute("data-email"),
      initials: actEl.getAttribute("data-name").split(" ").map(function(w){ return w[0]; }).join("").slice(0,2).toUpperCase() };
    save(); closeModal(); nav("home");
    toast("👋 Chào " + S.account.name + "! Bắt đầu tại ô Input phổ quát.");
    return;
  }
  if(act === "resume-demo"){ nav("home"); return; }

  if(act === "attach"){
    var t = actEl.getAttribute("data-type");
    var mock = { file:"bao-cao-tu-duy.pdf", image:"anh-bieu-do.jpg", youtube:"youtube.com/watch?v=demo", facebook:"facebook.com/groups/gon/posts/123", web:"article.vn/tu-duy-phan-bien" }[t];
    PENDING_ATTACHES.push({ type:t, em:inputEm(t), label:inputLabel(t) + ": " + mock, value:mock });
    trackInput(t, mock); renderAttached();
    toast("📎 Đã đính " + inputLabel(t).toLowerCase() + " (mock) — nằm trong nguyên liệu Brew & Proof");
    return;
  }
  if(act === "detach"){ PENDING_ATTACHES.splice(Number(actEl.getAttribute("data-i")), 1); renderAttached(); return; }

  if(act === "uni-search"){
    var v = document.getElementById("uni-input").value.trim();
    if(v) trackInput("text", v);
    LAST_QUERY = v; CURRENT_PERSONA = CURRENT_PERSONA || "phd";
    nav("search"); return;
  }
  if(act === "trend-go" || act === "rec-go"){
    var topic = actEl.getAttribute("data-topic") || "";
    if(topic){ trackInput("text", topic); LAST_QUERY = topic; }
    else LAST_QUERY = "";
    nav("search"); return;
  }
  if(act === "report-ack"){ grantBadge("safety"); toast("🚦 Đã ghi nhận — cảm ơn sự thận trọng của bạn"); return; }

  if(act === "persona"){
    CURRENT_PERSONA = actEl.getAttribute("data-p");
    render(); // render lại toàn bộ màn hình search với thứ hạng mới
    return;
  }
  if(act === "go-brew"){ BREW_STATE = { phase:"form" }; nav("brew"); return; }
  if(act === "brew-start"){
    var sel = document.getElementById("brew-persona");
    if(sel) CURRENT_PERSONA = sel.value;
    startBrew(); return;
  }

  if(act === "learn-sec"){ LEARN_SEC = Number(actEl.getAttribute("data-sec")) || 0; nav("learn"); return; }
  if(act === "check-submit"){ submitCheck(); return; }

  if(act === "view-format"){
    VIEW_FMT = { sec: Number(actEl.getAttribute("data-sec")) || 0, fmt: actEl.getAttribute("data-fmt") };
    nav("output"); return;
  }
  if(act === "video-play"){
    var vm = document.getElementById("video-mock");
    if(vm){ vm.classList.add("playing"); actEl.textContent = "⏸"; toast("▶ Đang phát video mô phỏng 6 phút"); }
    return;
  }

  if(act === "game-submit"){ submitGame(); return; }
  if(act === "game-reset"){ GAME_ANSWERS = []; GAME_SUBMITTED = false; GAME_SCORE = 0; render(); return; }

  if(act === "fork"){ doFork(actEl.getAttribute("data-topic"), actEl.getAttribute("data-from")); return; }
  if(act === "vote"){ doVote(actEl.getAttribute("data-choice")); return; }

  if(act === "share"){
    openModal('<h3>Chia sẻ lên ' + actEl.getAttribute("data-net") + ' (mock)</h3>' +
      '<p>Production flow: OAuth chia sẻ + ảnh chứng nhận render từ GDevelop + liên kết về hành trình công khai của bạn.</p>' +
      '<p class="small muted">Demo: chỉ ghi nhận ý định chia sẻ — không network call.</p>' +
      '<div class="row"><button class="btn primary" type="button" onclick="closeModal()">Đã hiểu</button></div>');
    return;
  }
  if(act === "download-cert" || act === "export-data"){ exportData(); return; }

  if(act === "delete-data"){ deleteData(); return; }
  if(act === "delete-confirm"){
    localStorage.removeItem(STORAGE_KEY);
    S = JSON.parse(JSON.stringify(DEFAULT_STATE));
    PENDING_ATTACHES = []; LAST_QUERY = ""; GAME_ANSWERS = []; GAME_SUBMITTED = false;
    closeModal(); renderHeader(); nav("welcome");
    toast("🗑 Đã xoá dữ liệu demo");
    return;
  }
  if(act === "reset-demo"){
    openModal('<h3>Reset demo?</h3><p>Xoá toàn bộ tiến trình (XP, huy hiệu, lịch sử) và quay về màn hình chào mừng.</p>' +
      '<div class="row"><button class="btn danger" type="button" data-act="delete-confirm">Reset</button><button class="btn ghost" type="button" onclick="closeModal()">Huỷ</button></div>');
    return;
  }
});

/* accessibility: trend cards mở bằng Enter */
document.addEventListener("keydown", function(e){
  if(e.key === "Enter" && e.target.classList && e.target.classList.contains("trend-card")){
    e.target.click();
  }
});

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

/* ---------------- Khởi động ---------------- */
if(!location.hash) location.hash = "#/welcome";
render();
</script>
