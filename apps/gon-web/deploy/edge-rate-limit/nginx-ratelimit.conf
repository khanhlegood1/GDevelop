# nginx origin rate limiting — GON edge layer (P05-R1.10)
# STATUS: NOT RUN — packaged for real infrastructure only.
# Include inside the http {} block; apply `limit_req` to the /v1 location.

# Burst buckets mirror the app defaults (deploy/edge-rate-limit/README.md).
limit_req_zone $binary_remote_addr zone=gon_ip_read:16m  rate=4r/s;
limit_req_zone $binary_remote_addr zone=gon_ip_write:16m rate=2r/s;

# Fail-closed flood guard: bursts queue only briefly, then 429.
# nodelay + burst keeps latency low for interactive clients while
# still hard-capping instantaneous floods.
server {
  location /v1 {
    limit_req zone=gon_ip_write burst=30 nodelay;
    limit_req_status 429;
    # Retry-After is set by the app's problem+json response (RATE_LIMITED);
    # for edge-only denials add a static hint:
    add_header Retry-After 30 always;
  }

  location = /healthz {
    limit_req zone=gon_ip_read burst=10 nodelay;
    limit_req_status 429;
  }
}
